<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0E14">
<title>History — MACHINE SEARCH</title>
<link rel="stylesheet" href="brand.css">
<link rel="stylesheet" href="components.css">
<link rel="stylesheet" href="bg.css">
<link rel="stylesheet" href="styles.css">

<style id="ms-black-bg-theme">
  html, body {
    background-color: #0B0E14;
    color: #CBD5E1;
    -webkit-font-smoothing: antialiased;
  }

  .topbar, .app-header, .ms-header, .back-header, .ms-back-header, header,
  .bottom-nav, .ms-bottom-nav, nav.bottom-nav {
    background-color: #10141C;
    color: #CBD5E1;
    border-color: #252C3A;
  }

  .card, .panel, .box, .ms-card, .state, [class*="card"] {
    background: #12161F;
    color: #CBD5E1;
    border-color: #252C3A;
    box-shadow: none;
  }

  input, select, textarea {
    background-color: #090C11;
    color: #CBD5E1;
    border-color: #2D3648;
  }

  button, .btn {
    background: #1B2230;
    color: #E2E8F0;
    border-color: #2D3648;
    box-shadow: none;
  }
</style>
</head>
<body>
<div id="app"></div>
<script src="app.js?v=1005"></script>
<script>
(function() {
  const app = document.getElementById('app');
  app.innerHTML = MS.backHeader('Search History') + `
    <main class="container" style="padding-top: var(--sp-4)">
      <div id="list"></div>
    </main>
  ` + MS.bottomNav('search');

  function render() {
    const list = document.getElementById('list');
    const hist = MS.getHistory();

    if (hist.length === 0) {
      list.innerHTML = `<div class="state">
        <div class="state__icon">${MS.ICON.clock}</div>
        <div class="state__title">No search history</div>
        <div class="state__subtitle">Your recent searches will appear here.</div>
      </div>`;
      return;
    }

    list.innerHTML = hist.map(q => `
      <div class="db-list-item" style="margin-bottom:8px" onclick="location.href='search.html?q=${encodeURIComponent(q)}'">
        <div class="db-list-item__icon" style="background:var(--surface-2);color:var(--text-secondary)">
          ${MS.ICON.clock}
        </div>
        <div class="db-list-item__body">
          <div class="db-list-item__name" style="margin-top:6px">${MS.escapeHtml(q)}</div>
        </div>
        <button class="icon-btn" onclick="event.stopPropagation(); removeHist('${MS.escapeHtml(q)}')" style="color:var(--text-muted)">
          ${MS.ICON.close}
        </button>
      </div>
    `).join('');
  }

  window.removeHist = function(q) {
    MS.removeHistory(q);
    render();
  };

  render();
})();
</script>
</body>
</html>

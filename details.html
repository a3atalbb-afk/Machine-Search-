<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0E14">
<title>Machine Details — MACHINE SEARCH</title>
<link rel="stylesheet" href="brand.css">
<link rel="stylesheet" href="components.css">
<link rel="stylesheet" href="bg.css">
<link rel="stylesheet" href="styles.css">
<style>
  .detail-hero {
    background: linear-gradient(160deg, #14213D 0%, #1B2D4A 100%);
    padding: 32px 16px 24px;
    text-align: center;
    position: relative;
    overflow: hidden;
    border-bottom: 4px solid var(--color-gold, #F4A623);
  }
  .detail-hero::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(245,174,50,.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(245,174,50,.05) 1px, transparent 1px);
    background-size: 28px 28px;
  }
  .detail-hero > * { position: relative; z-index: 1; }

  .detail-hero__icon {
    width: 80px;
    height: 80px;
    margin: 0 auto 16px;
    border-radius: var(--r-lg, 16px);
    background: var(--color-gold, #F4A623);
    color: var(--color-primary, #D32F2F);
    display: grid;
    place-items: center;
    box-shadow: 0 8px 24px rgba(245,174,50,.3), inset 0 2px 4px rgba(255,255,255,.5);
  }
  .detail-hero__icon svg { width: 40px !important; height: 40px !important; }

  .detail-hero__name {
    font-size: 24px;
    font-weight: 900;
    line-height: 1.2;
    margin-bottom: 12px;
    word-break: break-word;
    color: #FFFFFF;
  }

  .detail-hero__badges {
    display: flex;
    gap: 8px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .detail-hero__badges .pill {
    background: rgba(255,255,255,.15);
    border: 1px solid rgba(255,255,255,.2);
    font-size: 12px;
    color: #FFFFFF;
  }

  .code-block {
    background: var(--surface, #151C2C);
    border: 2px solid var(--border, #2A364F);
    border-radius: var(--r-md, 12px);
    padding: 16px;
    margin: 16px 0;
  }
  .code-block__label {
    font-size: 11px;
    font-weight: 900;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--text-muted, #64748B);
    margin-bottom: 8px;
  }
  .code-block__value {
    font-family: var(--font-mono, monospace);
    font-size: 15px;
    color: #FFFFFF;
    word-break: break-all;
    line-height: 1.5;
    margin-bottom: 16px;
    font-weight: 600;
  }

  .action-row {
    display: flex;
    gap: 12px;
  }
  .action-row .btn--copy-main {
    flex: 1;
    height: 48px;
    background: var(--color-gold, #F4A623);
    color: var(--color-primary, #D32F2F);
    border-radius: var(--r-sm, 8px);
    font-weight: 900;
    font-size: 14px;
    display: grid;
    place-items: center;
    border: none;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(245,174,50,.3);
  }
  .action-row .fav-btn-main {
    width: 48px;
    height: 48px;
    background: var(--bg, #0A0F1D);
    border: 2px solid var(--border, #2A364F);
    border-radius: var(--r-sm, 8px);
    display: grid;
    place-items: center;
    cursor: pointer;
    color: var(--text-muted, #64748B);
  }
  .action-row .fav-btn-main.is-active {
    color: var(--color-gold, #F4A623);
    border-color: var(--color-gold, #F4A623);
    background: rgba(245,174,50,.1);
  }
  .action-row .fav-btn-main svg {
    width: 24px !important;
    height: 24px !important;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
  }
  .action-row .fav-btn-main.is-active svg { fill: currentColor; }

  .btn--ghost {
    background: var(--surface, #151C2C);
    color: var(--text, #F4F5F7);
    border: 2px solid var(--border, #2A364F);
    border-radius: var(--r-sm, 8px);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-weight: 800;
    cursor: pointer;
    transition: border-color 0.2s;
  }
  .btn--ghost:hover {
    border-color: var(--color-gold, #F4A623);
  }
</style>
</head>
<body>
<div id="app"></div>
<script src="app.js?v=1006"></script>
<script>
(async function () {
  const app = document.getElementById('app');
  const params = new URLSearchParams(location.search);
  const code = params.get('code');

  if (!code) {
    app.innerHTML = MS.backHeader('Machine Details') +
      '<main class="container" style="padding-top: 32px;">' +
        '<div class="state">' +
          '<div class="state__icon">' + MS.ICON.warning + '</div>' +
          '<div class="state__title">No machine specified</div>' +
          '<div class="state__subtitle">Open a machine from search or database</div>' +
        '</div>' +
      '</main>' +
      MS.bottomNav('database');
    return;
  }

  let data;
  try {
    data = await MS.loadData();
  } catch (e) {
    app.innerHTML = MS.backHeader('Machine Details') +
      '<main class="container" style="padding-top: 32px;">' +
        '<div class="state">' +
          '<div class="state__icon">' + MS.ICON.warning + '</div>' +
          '<div class="state__title">Database load failed</div>' +
        '</div>' +
      '</main>' +
      MS.bottomNav('database');
    return;
  }

  const m = (data.machines || []).find(x => x.code === code);

  if (!m) {
    app.innerHTML = MS.backHeader('Machine Details') +
      '<main class="container" style="padding-top: 32px;">' +
        '<div class="state">' +
          '<div class="state__icon">' + MS.ICON.warning + '</div>' +
          '<div class="state__title">Machine not found</div>' +
          '<div class="state__subtitle">Code: ' + MS.escapeHtml(code) + '</div>' +
        '</div>' +
      '</main>' +
      MS.bottomNav('search');
    return;
  }

  const fav = MS.isFavorite(m.code);
  // Do NOT destroy location — show it as-is
  const loc = m.location || '—';
  const num = (m.number != null) ? m.number : '—';
  const arrivalHtml = m.arrival
    ? '<div class="info-row"><span class="info-row__key">Arrival Date</span><span class="info-row__value">' + MS.escapeHtml(m.arrival) + '</span></div>'
    : '';
  const sourceFile = (data.meta && data.meta.filename) ? data.meta.filename : '—';

  app.innerHTML = MS.backHeader('Machine Details') +
    '<main style="padding-bottom: 32px;">' +
      '<div class="detail-hero">' +
        '<div class="detail-hero__icon">' + MS.ICON.machine + '</div>' +
        '<div class="detail-hero__name">' + MS.escapeHtml(m.name) + '</div>' +
        '<div class="detail-hero__badges">' +
          '<span class="pill">📍 ' + MS.escapeHtml(loc) + '</span>' +
          '<span class="pill">#' + MS.escapeHtml(String(num)) + '</span>' +
        '</div>' +
      '</div>' +

      '<div class="container">' +
        '<div class="code-block">' +
          '<div class="code-block__label">Original Machine Code</div>' +
          '<div class="code-block__value">' + MS.escapeHtml(m.code) + '</div>' +
          '<div class="action-row">' +
            '<button class="btn--copy-main" id="copyBtn">COPY CODE</button>' +
            '<button class="fav-btn-main ' + (fav ? 'is-active' : '') + '" id="favBtn" aria-label="Favorite">' +
              (fav ? MS.ICON.starFilled : MS.ICON.star) +
            '</button>' +
          '</div>' +
        '</div>' +

        '<div class="section-title">Information</div>' +
        '<div class="card card--pad">' +
          '<div class="info-list">' +
            '<div class="info-row"><span class="info-row__key">Name</span><span class="info-row__value">' + MS.escapeHtml(m.name) + '</span></div>' +
            '<div class="info-row"><span class="info-row__key">Code</span><span class="info-row__value">' + MS.escapeHtml(m.code) + '</span></div>' +
            '<div class="info-row"><span class="info-row__key">Location</span><span class="info-row__value">' + MS.escapeHtml(loc) + '</span></div>' +
            '<div class="info-row"><span class="info-row__key">Number</span><span class="info-row__value">' + MS.escapeHtml(String(num)) + '</span></div>' +
            arrivalHtml +
            '<div class="info-row"><span class="info-row__key">Source File</span><span class="info-row__value">' + MS.escapeHtml(sourceFile) + '</span></div>' +
          '</div>' +
        '</div>' +

        '<div style="margin-top: 24px;">' +
          '<a href="search.html?q=' + encodeURIComponent(m.name) + '" class="btn--ghost" style="width: 100%; height: 48px; text-decoration: none;">' +
            MS.ICON.search + ' &nbsp; SEARCH SIMILAR' +
          '</a>' +
        '</div>' +
      '</div>' +
    '</main>' +
    MS.bottomNav('database');

  // Copy handler
  document.getElementById('copyBtn').addEventListener('click', async () => {
    const ok = await MS.copy(m.code);
    const btn = document.getElementById('copyBtn');
    if (ok) {
      const orig = btn.textContent;
      btn.textContent = '✓ COPIED';
      MS.toast('Code copied', 'ok');
      setTimeout(() => { btn.textContent = orig; }, 1400);
    } else {
      MS.toast('Clipboard failed', 'err');
    }
  });

  // Favorite handler
  document.getElementById('favBtn').addEventListener('click', () => {
    const added = MS.toggleFavorite(m);
    const btn = document.getElementById('favBtn');
    btn.classList.toggle('is-active', added);
    btn.innerHTML = added ? MS.ICON.starFilled : MS.ICON.star;
    MS.toast(added ? 'Added to favorites' : 'Removed', added ? 'ok' : '');
  });
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0E14">
<title>MACHINE SEARCH</title>
<link rel="stylesheet" href="brand.css">
<link rel="stylesheet" href="components.css">
<link rel="stylesheet" href="bg.css">
<link rel="stylesheet" href="styles.css">
<style>
  html, body {
    height: 100%;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
  }

  /* ===== HEADER (Fixed Position, Not Overlay) ===== */
  .custom-header {
    position: relative;
    z-index: 50;
    background: #0A0E14;
    border-bottom: 1px solid rgba(220, 38, 38, 0.3);
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .custom-header__brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .custom-header__logo {
    width: 36px; height: 36px;
  }
  .custom-header__text {
    display: flex; flex-direction: column;
  }
  .custom-header__name {
    font-size: 18px; font-weight: 900; color: #fff; line-height: 1;
    letter-spacing: 0.5px;
  }
  .custom-header__name span { color: #DC2626; }
  .custom-header__tag {
    font-size: 9px; font-weight: 700; color: #94A3B8; letter-spacing: 1px;
    margin-top: 2px;
  }
  .custom-header__settings {
    width: 36px; height: 36px; border-radius: 8px;
    background: #141A24; border: 1px solid #2A3441;
    display: grid; place-items: center; color: #94A3B8;
    text-decoration: none;
  }
  .custom-header__settings svg { width: 20px !important; height: 20px !important; }

  /* ===== HERO SECTION (Cover Photo) ===== */
  .home-hero {
    position: relative;
    width: 100%;
    height: 320px; /* Mobile အတွက် သင့်တင့်တဲ့ အမြင့် */
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: flex-end; /* စာသားတွေကို အောက်ခြေမှာ ထားမယ် */
    padding: 20px;
  }
  .home-hero-bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 20%; /* မျက်နှာကို အာရုံစိုက်မယ် */
    z-index: 1;
    transition: opacity 1.5s ease-in-out;
  }
  .home-hero-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom, rgba(10,14,20,0.1) 0%, rgba(10,14,20,0.8) 70%, rgba(10,14,20,1) 100%);
    z-index: 2;
  }
  .home-hero-content {
    position: relative;
    z-index: 3;
    width: 100%;
    padding-bottom: 10px;
  }
  .home-hero-content h1 {
    font-size: 36px;
    font-weight: 900;
    font-style: italic;
    line-height: 1.05;
    color: #fff;
    margin: 0 0 8px;
    text-transform: uppercase;
    text-shadow: 0 4px 15px rgba(0,0,0,0.9);
  }
  .home-hero-content h1 span {
    color: #DC2626;
    display: block;
  }
  .home-hero-content p {
    font-size: 14px;
    color: #E2E8F0;
    font-weight: 600;
    margin: 0;
    text-shadow: 0 2px 5px rgba(0,0,0,0.9);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .home-hero-content p::before {
    content: '';
    width: 4px; height: 14px;
    background: #DC2626;
    border-radius: 2px;
    box-shadow: 0 0 10px rgba(220,38,38,0.8);
  }

  /* ===== MAIN CONTENT ===== */
  .home-main {
    padding: 0 16px 100px;
    position: relative;
    z-index: 10;
    margin-top: -20px; /* Search box ကို ပုံပေါ် နည်းနည်း ခွာတင်မယ် */
  }

  /* Search Box */
  .home-search-box {
    display: flex;
    align-items: center;
    background: #141A24;
    border: 2px solid #DC2626;
    border-radius: 30px;
    padding: 0 16px;
    height: 54px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.6), 0 0 15px rgba(220,38,38,0.2);
    text-decoration: none;
    margin-bottom: 20px;
  }
  .home-search-box__icon { color: #fff; display: flex; margin-right: 12px; }
  .home-search-box__icon svg { width: 20px !important; height: 20px !important; }
  .home-search-box__input {
    flex: 1;
    background: transparent;
    border: none;
    color: #94A3B8;
    font-size: 14px;
    outline: none;
    font-weight: 500;
  }
  .home-search-box__filter {
    color: #fff;
    display: flex;
    margin-left: 12px;
    padding-left: 12px;
    border-left: 1px solid rgba(255,255,255,0.1);
  }
  .home-search-box__filter svg { width: 20px !important; height: 20px !important; }

  /* Stats Grid */
  .home-stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 24px;
  }
  .home-stat {
    background: #141A24;
    border: 1px solid #2A3441;
    border-radius: 12px;
    padding: 14px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .home-stat--red { border-color: rgba(220,38,38,0.4); }
  .home-stat--gold { border-color: rgba(245,158,11,0.4); }
  .home-stat__icon {
    width: 36px; height: 36px; display: grid; place-items: center; flex-shrink: 0;
  }
  .home-stat__icon svg { width: 28px !important; height: 28px !important; }
  .home-stat__icon--red { color: #fff; }
  .home-stat__icon--gold { color: #F59E0B; }
  .home-stat__info { display: flex; flex-direction: column; }
  .home-stat__label {
    font-size: 10px; font-weight: 800; color: #94A3B8;
    text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 2px;
  }
  .home-stat__value { font-size: 20px; font-weight: 900; color: #fff; line-height: 1; }
  .home-stat__value--gold { color: #F59E0B; font-size: 12px; margin-top: 2px; }

  /* Quick Access */
  .home-section-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 12px;
  }
  .home-section-title {
    display: flex; align-items: center; gap: 8px;
    font-size: 18px; font-weight: 900; color: #fff;
  }
  .home-section-title::before {
    content: ''; width: 4px; height: 18px;
    background: #DC2626; border-radius: 2px;
  }
  .home-section-link {
    font-size: 12px; font-weight: 700; color: #94A3B8;
    text-decoration: none; display: flex; align-items: center; gap: 4px;
  }
  .home-section-link svg { width: 16px !important; height: 16px !important; }

  .home-quick-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 24px;
  }
  .home-quick {
    background: #141A24;
    border: 1px solid #2A3441; border-radius: 12px;
    padding: 14px; display: flex; align-items: center; gap: 10px;
    text-decoration: none; color: #fff;
    position: relative;
  }
  .home-quick--red { border-color: rgba(220,38,38,0.4); }
  .home-quick__icon {
    width: 32px; height: 32px; display: grid; place-items: center; flex-shrink: 0;
  }
  .home-quick__icon svg { width: 24px !important; height: 24px !important; }
  .home-quick__icon--grey { color: #CBD5E1; }
  .home-quick__icon--red { color: #EF4444; }
  .home-quick__text { flex: 1; display: flex; flex-direction: column; }
  .home-quick__title { font-size: 14px; font-weight: 800; margin-bottom: 2px; }
  .home-quick__sub { font-size: 10px; color: #94A3B8; }

  /* How It Works */
  .home-how {
    display: flex; align-items: center; justify-content: space-between;
    background: #141A24;
    border: 1px solid #2A3441; border-radius: 12px;
    padding: 16px; margin-bottom: 24px;
    text-decoration: none;
  }
  .home-how__left { display: flex; align-items: center; gap: 12px; }
  .home-how__icon {
    width: 36px; height: 36px; border-radius: 50%;
    background: rgba(245,158,11,0.1); color: #F59E0B;
    display: grid; place-items: center;
  }
  .home-how__icon svg { width: 20px !important; height: 20px !important; }
  .home-how__title { font-size: 14px; font-weight: 800; color: #fff; margin-bottom: 2px; }
  .home-how__sub { font-size: 11px; color: #94A3B8; }
  .home-how__btn {
    background: transparent; border: 1px solid #DC2626; color: #DC2626;
    padding: 6px 12px; border-radius: 16px; font-size: 11px; font-weight: 800;
    display: flex; align-items: center; gap: 4px;
  }
  .home-how__btn svg { width: 12px !important; height: 12px !important; }
</style>
</head>
<body>
<div id="app"></div>
<script src="app.js?v=1008"></script>
<script>
(async function () {
  const app = document.getElementById('app');

  let data;
  try {
    data = await MS.loadData();
  } catch (e) {
    app.innerHTML = MS.header() +
      '<main class="container">' +
        '<div class="state" style="padding-top:40px;">' +
          '<div class="state__icon">' + MS.ICON.warning + '</div>' +
          '<div class="state__title">Database load failed</div>' +
        '</div>' +
      '</main>' +
      MS.bottomNav('home');
    return;
  }

  const machines = data.machines || [];
  const has = data.meta && data.meta.filename !== '—';
  const count = machines.length;
  const covers = JSON.parse(localStorage.getItem('ms_covers_v1') || '[]');

  // Default Cover မရှိရင် အစားထိုး ပြဖို့
  const defaultCover = 'https://images.unsplash.com/photo-1542751371-adc38448a05e?q=80&w=800&auto=format&fit=crop';
  const activeCover = covers.length > 0 ? covers[0] : defaultCover;

  const headerHtml = 
    '<header class="custom-header">' +
      '<div class="custom-header__brand">' +
        '<svg class="custom-header__logo" viewBox="0 0 100 100" fill="none"><path d="M50 10 L85 30 L85 70 L50 90 L15 70 L15 30 Z" stroke="#DC2626" stroke-width="6" fill="none"/><circle cx="50" cy="50" r="15" stroke="#DC2626" stroke-width="6" fill="none"/><path d="M65 65 L80 80" stroke="#DC2626" stroke-width="6" stroke-linecap="round"/></svg>' +
        '<div class="custom-header__text">' +
          '<div class="custom-header__name">MACHINE <span>SEARCH</span></div>' +
          '<div class="custom-header__tag">OFFLINE DATABASE</div>' +
        '</div>' +
      '</div>' +
      '<a href="settings.html" class="custom-header__settings">' + MS.ICON.settings + '</a>' +
    '</header>';

  app.innerHTML = 
    headerHtml +
    '<main style="padding-bottom: 80px;">' +

      // ===== HERO SECTION =====
      '<div class="home-hero">' +
        (covers.length > 0 
          ? covers.map((c, i) => `<img src="${c}" class="home-hero-bg ${i === 0 ? 'active' : ''}" style="opacity: ${i === 0 ? 1 : 0};">`).join('')
          : `<img src="${defaultCover}" class="home-hero-bg active" style="opacity: 1;">`
        ) +
        '<div class="home-hero-overlay"></div>' +
        '<div class="home-hero-content">' +
          '<h1>Find your <span>machine.</span></h1>' +
          '<p>Search names, codes & locations.</p>' +
        '</div>' +
      '</div>' +

      // ===== MAIN CONTENT =====
      '<div class="home-main">' +

        // Search Box
        '<a href="search.html" class="home-search-box">' +
          '<span class="home-search-box__icon">' + MS.ICON.search + '</span>' +
          '<input type="text" class="home-search-box__input" placeholder="Search machine or code..." readonly style="cursor:pointer;">' +
          '<span class="home-search-box__filter">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="21" x2="4" y2="14"></line><line x1="4" y1="10" x2="4" y2="3"></line><line x1="12" y1="21" x2="12" y2="12"></line><line x1="12" y1="8" x2="12" y2="3"></line><line x1="20" y1="21" x2="20" y2="16"></line><line x1="20" y1="12" x2="20" y2="3"></line><line x1="1" y1="14" x2="7" y2="14"></line><line x1="9" y1="8" x2="15" y2="8"></line><line x1="17" y1="16" x2="23" y2="16"></line></svg>' +
          '</span>' +
        '</a>' +

        // Stats
        '<div class="home-stats">' +
          '<div class="home-stat home-stat--red">' +
            '<div class="home-stat__icon home-stat__icon--red">' +
              '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M7 12h.01M12 12h.01M17 12h.01"/><path d="M7 8h.01M12 8h.01M17 8h.01"/><path d="M7 16h.01M12 16h.01M17 16h.01"/></svg>' +
            '</div>' +
            '<div class="home-stat__info">' +
              '<div class="home-stat__label">MACHINES</div>' +
              '<div class="home-stat__value">' + (has ? count.toLocaleString() : '0') + '</div>' +
            '</div>' +
          '</div>' +
          '<div class="home-stat home-stat--gold">' +
            '<div class="home-stat__icon home-stat__icon--gold">' + MS.ICON.database + '</div>' +
            '<div class="home-stat__info">' +
              '<div class="home-stat__label">DATABASE</div>' +
              '<div class="home-stat__value home-stat__value--gold">LOCAL · OFFLINE</div>' +
            '</div>' +
          '</div>' +
        '</div>' +

        // Quick Access
        '<div class="home-section-head">' +
          '<div class="home-section-title">Quick Access</div>' +
          '<a href="database.html" class="home-section-link">View All <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg></a>' +
        '</div>' +

        '<div class="home-quick-grid">' +
          '<a href="database.html" class="home-quick">' +
            '<div class="home-quick__icon home-quick__icon--grey">' + MS.ICON.database + '</div>' +
            '<div class="home-quick__text">' +
              '<div class="home-quick__title">Database</div>' +
              '<div class="home-quick__sub">Machine Data</div>' +
            '</div>' +
          '</a>' +
          '<a href="favorites.html" class="home-quick home-quick--red">' +
            '<div class="home-quick__icon home-quick__icon--red">' + MS.ICON.star + '</div>' +
            '<div class="home-quick__text">' +
              '<div class="home-quick__title">Favorites</div>' +
              '<div class="home-quick__sub">Your Collection</div>' +
            '</div>' +
          '</a>' +
          '<a href="history.html" class="home-quick">' +
            '<div class="home-quick__icon home-quick__icon--grey">' + MS.ICON.clock + '</div>' +
            '<div class="home-quick__text">' +
              '<div class="home-quick__title">History</div>' +
              '<div class="home-quick__sub">Recent Searches</div>' +
            '</div>' +
          '</a>' +
          '<a href="import.html" class="home-quick home-quick--red">' +
            '<div class="home-quick__icon home-quick__icon--red">' +
              '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="16" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>' +
            '</div>' +
            '<div class="home-quick__text">' +
              '<div class="home-quick__title">Import Excel</div>' +
              '<div class="home-quick__sub">Add Database</div>' +
            '</div>' +
          '</a>' +
        '</div>' +

        // How It Works
        '<a href="help.html" class="home-how">' +
          '<div class="home-how__left">' +
            '<div class="home-how__icon">' + MS.ICON.info + '</div>' +
            '<div>' +
              '<div class="home-how__title">How It Works</div>' +
              '<div class="home-how__sub">Find · Learn · Solve</div>' +
            '</div>' +
          '</div>' +
          '<div class="home-how__btn">Learn More <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg></div>' +
        '</a>' +

      '</div>' +

    '</main>' +
    MS.bottomNav('home');

  // ===== Slideshow Logic =====
  if (covers.length > 1) {
    let currentIndex = 0;
    const imgs = document.querySelectorAll('.home-hero-bg');
    
    setInterval(() => {
      imgs[currentIndex].style.opacity = '0';
      currentIndex = (currentIndex + 1) % covers.length;
      imgs[currentIndex].style.opacity = '1';
    }, 5000); // 5 စက္ကန့်တစ်ခါ ပြောင်းမယ်
  }

})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0F1D">
<title>MACHINE SEARCH</title>
<link rel="stylesheet" href="brand.css">
<link rel="stylesheet" href="components.css">
<link rel="stylesheet" href="bg.css">
<style>
  .welcome-block { text-align: center; margin-bottom: 24px; }
  .welcome-block h2 { font-size: 26px; font-weight: 900; line-height: 1.2; color: #FFFFFF; margin-bottom: 8px; letter-spacing: 0.5px; text-shadow: 0 0 15px rgba(255,255,255,0.15); }
  .welcome-block h2 .accent { color: var(--color-primary); text-shadow: 0 0 15px rgba(229,57,53,0.5); }
  .welcome-block p { color: #A0ABC0; font-size: 14px; line-height: 1.5; font-weight: 500; }
  
  .input-wrap { height: 52px; border-radius: 12px; background: #121829; box-shadow: inset 3px 3px 6px rgba(0,0,0,0.6), inset -2px -2px 5px rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.05); }
  .input-wrap__icon { color: var(--color-primary); filter: drop-shadow(0 0 5px rgba(229,57,53,0.4)); }
  .input-wrap input { font-size: 15px; }

  .stats-grid { display: flex; gap: 12px; margin-top: 20px; }
  .stat-box { flex: 1; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px 12px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.2); position: relative; overflow: hidden; }
  .stat-box::before { content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; background: var(--color-primary); }
  .stat-box .v { font-size: 24px; font-weight: 900; color: #fff; line-height: 1.2; }
  .stat-box .l { font-size: 10px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-top: 4px; }
  
  .quick-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 12px; }
  .quick-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-decoration: none; color: #fff; transition: transform 0.2s; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
  .quick-card:active { transform: scale(0.96); }
  .quick-card__title { font-weight: 800; font-size: 14px; letter-spacing: 0.5px; }
  .quick-card .icon-box { width: 48px; height: 48px; border-radius: 12px; background: #121829; box-shadow: inset 3px 3px 6px rgba(0,0,0,0.5), inset -2px -2px 5px rgba(255,255,255,0.05); }
  .quick-card .icon-box svg { width: 22px !important; height: 22px !important; color: #fff; }
  .quick-card .icon-box--red { background: linear-gradient(135deg, #FF5252 0%, #D32F2F 100%); box-shadow: 0 0 15px rgba(229,57,53,0.4), inset 2px 2px 5px rgba(255,255,255,0.3); }

  .info-section { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 16px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
  .info-section h3 { font-size: 16px; font-weight: 900; color: #fff; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--border); padding-bottom: 12px; }
  .info-section h3 svg { color: var(--color-primary); width: 20px !important; height: 20px !important; }
  .info-item { display: flex; gap: 12px; margin-bottom: 16px; }
  .info-item__icon { width: 28px; height: 28px; border-radius: 8px; background: rgba(229,57,53,0.1); display: grid; place-items: center; color: var(--color-primary); flex-shrink: 0; }
  .info-item__icon svg { width: 14px !important; height: 14px !important; }
  .info-item__text { font-size: 14px; color: var(--text-secondary); line-height: 1.6; }
  .info-item__text b { color: #fff; }
  
  .faq-item { margin-bottom: 12px; border-bottom: 1px solid var(--border); padding-bottom: 12px; }
  .faq-item:last-child { border-bottom: none; padding-bottom: 0; margin-bottom: 0; }
  .faq-q { font-weight: 800; color: #fff; font-size: 14px; margin-bottom: 4px; }
  .faq-a { color: var(--text-secondary); font-size: 13px; line-height: 1.5; }
</style>
</head>
<body>
<div id="app"></div>
<script src="app.js"></script>
<script>
(async function () {
  const app = document.getElementById('app');
  const data = await MS.loadData();
  const machines = data.machines || [];
  const has = data.meta && data.meta.filename !== '—';

  const iconInfo = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>`;
  const iconBook = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>`;

  app.innerHTML = MS.header() + `
    <main class="container">
      <div style="padding-top: 24px;">
        <div class="welcome-block">
          <h2>FIND YOUR <span class="accent">MACHINE</span></h2>
          <p>Search arcade machines and discover their original codes instantly.</p>
        </div>
        
        <a href="search.html" style="text-decoration:none; display:block;">
          <div class="input-wrap">
            <span class="input-wrap__icon">${MS.ICON.search}</span>
            <input type="text" placeholder="Search machines..." readonly style="cursor:pointer; font-weight: 600;">
          </div>
        </a>
        
        <div class="stats-grid">
          <div class="stat-box"><div class="v">${has ? machines.length : '0'}</div><div class="l">Total Machines</div></div>
          <div class="stat-box"><div class="v">${has ? MS.escapeHtml(data.meta.location) : '—'}</div><div class="l">Location</div></div>
        </div>
      </div>

      <div class="section-title" style="margin-top:32px;">Quick Access</div>
      <div class="quick-grid">
        <a href="database.html" class="quick-card">
          <div class="icon-box">${MS.ICON.database}</div>
          <div class="quick-card__title">Database</div>
        </a>
        <a href="favorites.html" class="quick-card">
          <div class="icon-box">${MS.ICON.star}</div>
          <div class="quick-card__title">Favorites</div>
        </a>
        <a href="history.html" class="quick-card">
          <div class="icon-box">${MS.ICON.clock}</div>
          <div class="quick-card__title">History</div>
        </a>
        <a href="import.html" class="quick-card">
          <div class="icon-box icon-box--red">${MS.ICON.upload}</div>
          <div class="quick-card__title">Import Excel</div>
        </a>
      </div>

      <div class="section-title" style="margin-top:32px;">အကြောင်းအရာ & အသုံးပြုနည်း</div>
      
      <div class="info-section">
        <h3>${iconInfo} MACHINE SEARCH ဆိုတာဘာလဲ？</h3>
        <div class="info-item">
          <div class="info-item__text">
            ဤ App သည် Arcade Game စက်များ၏ <b>မူရင်း Machine Code</b> များကို လျင်မြန်စွာ ရှာဖွေနိုင်ရန် ဖန်တီးထားသော Offline Application ဖြစ်ပါသည်။ အင်တာနက်မလိုအပ်ဘဲ မိမိတို့၏ Excel ဖိုင်များကို အသုံးပြု၍ ရှာဖွေနိုင်ပါသည်။
          </div>
        </div>
      </div>

      <div class="info-section" style="margin-bottom: 32px;">
        <h3>${iconInfo} မကြာခဏ မေးလေ့ရှိသော မေးခွန်းများ (FAQ)</h3>
        <div class="faq-item">
          <div class="faq-q">Excel ဖိုင်ကို ဘယ်လို ရှာရမလဲ？</div>
          <div class="faq-a">သင့်ဖုန်းရဲ့ Files app ထဲမှာ Excel ဖိုင်ကို ရှာပြီး Import လုပ်ပါ။</div>
        </div>
        <div class="faq-item">
          <div class="faq-q">အင်တာနက် မရှိရင် သုံးလို့ရလား？</div>
          <div class="faq-a">ရပါတယ်။ ဒီ App က လုံးဝ Offline အလုပ်လုပ်အောင် ဖန်တီးထားတာပါ။</div>
        </div>
      </div>

      <div style="text-align: center; color: var(--text-muted); font-size: 12px; margin-bottom: 24px;">
        MACHINE SEARCH v1.0.0<br>100% Offline Application
      </div>

    </main>
  ` + MS.bottomNav('home');
})();
</script>
</body>
</html>

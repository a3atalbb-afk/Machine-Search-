<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0E14">
<title>Favorites — MACHINE SEARCH</title>
<link rel="stylesheet" href="brand.css">
<link rel="stylesheet" href="components.css">
<link rel="stylesheet" href="bg.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app"></div>
<script src="app.js?v=1007"></script>
<script>
(function () {
  const app = document.getElementById('app');

  app.innerHTML = 
    '<header class="back-header" style="border-bottom:none;">' +
      '<a href="index.html" class="back-header__back" aria-label="Back">' + MS.ICON.back + '</a>' +
      '<div class="back-header__title">Favorites</div>' +
    '</header>' +
    '<main class="container" style="padding-top: 16px; padding-bottom: 96px;">' +
      '<div id="list"></div>' +
    '</main>' +
    MS.bottomNav('favorites');

  const list = document.getElementById('list');

  function render() {
    const favs = MS.getFavorites();

    if (favs.length === 0) {
      list.innerHTML = '<div class="state">' +
        '<div class="state__icon" style="color:var(--gold);">' + MS.ICON.star + '</div>' +
        '<div class="state__title">No favorites yet</div>' +
        '<div class="state__subtitle">Tap the star icon on any machine to save it here.</div>' +
      '</div>';
      return;
    }

    list.innerHTML = favs.map(f => {
      const loc = f.location || '—';
      const num = (f.number != null) ? f.number : '—';
      return '<div class="result-card" style="margin-bottom:12px">' +
        '<div class="result-card__head">' +
          '<a href="details.html?code=' + encodeURIComponent(f.code) + '" class="icon-box icon-box--gold" style="text-decoration:none;">' + MS.ICON.machine + '</a>' +
          '<div class="flex-1" style="min-width:0">' +
            '<div class="result-card__name">' + MS.escapeHtml(f.name) + '</div>' +
            '<div class="result-card__meta">' +
              '<span class="pill">📍 ' + MS.escapeHtml(loc) + '</span>' +
              '<span class="pill">#' + MS.escapeHtml(String(num)) + '</span>' +
            '</div>' +
          '</div>' +
          '<button class="fav-btn is-active" data-remove="' + MS.escapeHtml(f.code) + '" aria-label="Remove favorite">' +
            MS.ICON.starFilled +
          '</button>' +
        '</div>' +
        '<div class="result-card__code">' +
          '<div style="flex:1;min-width:0">' +
            '<div class="result-card__code-value">' + MS.escapeHtml(f.code) + '</div>' +
          '</div>' +
          '<button class="btn--copy" data-copy="' + MS.escapeHtml(f.code) + '">COPY</button>' +
        '</div>' +
      '</div>';
    }).join('');

    list.querySelectorAll('[data-remove]').forEach(btn => {
      btn.addEventListener('click', () => {
        MS.removeFavorite(btn.dataset.remove);
        MS.toast('Removed from favorites');
        render();
      });
    });

    list.querySelectorAll('[data-copy]').forEach(btn => {
      btn.addEventListener('click', async () => {
        const ok = await MS.copy(btn.dataset.copy);
        if (ok) {
          btn.textContent = '✓';
          btn.classList.add('is-copied');
          MS.toast('Copied', 'ok');
          setTimeout(() => {
            btn.textContent = 'COPY';
            btn.classList.remove('is-copied');
          }, 1200);
        } else {
          MS.toast('Copy failed', 'err');
        }
      });
    });
  }

  render();
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E53935">
<title>Error Solutions — MACHINE SEARCH</title>
<link rel="stylesheet" href="brand.css">
<link rel="stylesheet" href="components.css">
<link rel="stylesheet" href="bg.css">
<style>
  /* 3D Card Design */
  .ts-card {
    background: linear-gradient(145deg, #1A2235, #121829);
    border: 1px solid rgba(255,255,255,0.05); border-radius: 16px;
    padding: 20px; margin-bottom: 16px;
    box-shadow: 8px 8px 16px rgba(0,0,0,0.4), -4px -4px 12px rgba(255,255,255,0.03);
    position: relative;
  }
  .ts-header { display: flex; gap: 16px; align-items: flex-start; cursor: pointer; }
  .ts-icon {
    width: 44px; height: 44px; border-radius: 12px; background: rgba(229,57,53,0.1);
    color: var(--color-primary); display: grid; place-items: center; flex-shrink: 0;
    box-shadow: inset 2px 2px 5px rgba(0,0,0,0.5), inset -2px -2px 5px rgba(255,255,255,0.05);
  }
  .ts-icon svg { width: 24px !important; height: 24px !important; filter: drop-shadow(0 0 5px rgba(229,57,53,0.5)); }
  
  /* Machine Name ကို အပေါ်ဆုံးမှာ ထားမယ် */
  .ts-machine-title { font-size: 18px; font-weight: 900; color: #fff; margin-bottom: 4px; text-transform: uppercase; }
  .ts-error-title { font-size: 14px; color: var(--color-primary); font-weight: 800; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
  .ts-error-title svg { width: 16px !important; height: 16px !important; }
  .ts-desc { font-size: 14px; color: var(--text-secondary); line-height: 1.5; }
  
  .ts-body { display: none; margin-top: 16px; padding-top: 16px; border-top: 1px solid rgba(255,255,255,0.08); }
  .ts-body.show { display: block; animation: fadeIn 0.3s; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
  
  .ts-steps { padding-left: 20px; margin-bottom: 20px; }
  .ts-steps li { font-size: 14px; color: #fff; margin-bottom: 10px; line-height: 1.6; }
  
  .ts-img-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .ts-img { width: 100%; border-radius: 10px; border: 1px solid var(--border); object-fit: cover; height: 120px; cursor: pointer; }
  
  /* Actions (Edit/Delete) */
  .ts-actions { display: flex; gap: 8px; margin-top: 16px; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 12px; }
  .ts-btn { flex: 1; padding: 8px; border-radius: 8px; font-size: 12px; font-weight: 800; text-align: center; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 4px; }
  .ts-btn-edit { background: rgba(57,120,246,0.1); color: #3978F6; }
  .ts-btn-del { background: rgba(229,57,53,0.1); color: var(--color-primary); }
  .ts-btn svg { width: 14px !important; height: 14px !important; }

  /* Form Styles */
  .form-group { margin-bottom: 16px; }
  .form-label { display: block; font-size: 13px; font-weight: 800; color: #fff; margin-bottom: 8px; }
  .form-input {
    width: 100%; padding: 14px; background: #121829; border: 1px solid var(--border);
    border-radius: 10px; color: #fff; font-size: 14px; outline: none;
    box-shadow: inset 2px 2px 5px rgba(0,0,0,0.5);
  }
  .form-input:focus { border-color: var(--color-primary); }
  textarea.form-input { resize: vertical; min-height: 80px; }
  
  .file-input-wrap { position: relative; overflow: hidden; display: block; width: 100%; }
  .file-input-wrap input[type=file] { font-size: 100px; position: absolute; left: 0; top: 0; opacity: 0; cursor: pointer; }
  .file-btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    background: #121829; border: 1px dashed var(--color-primary); padding: 16px;
    border-radius: 10px; color: var(--color-primary); font-size: 14px; font-weight: 800;
  }
  .img-preview-list { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .img-preview { width: 60px; height: 60px; border-radius: 8px; object-fit: cover; border: 2px solid var(--border); }
  
  .btn-cancel { background: #121829; border: 1px solid var(--border); color: #fff; }
</style>
</head>
<body>
<div id="app"></div>
<script src="app.js?v=1006"></script>
<script>
(function() {
  const app = document.getElementById('app');
  const KEY = 'ms_troubleshoot_v2';
  let records = JSON.parse(localStorage.getItem(KEY) || '[]');
  let currentImages = [];
  let editId = null;

  // Default data
  if (records.length === 0) {
    records = [{
      id: 1, machine: 'PRIZE RUSH', error: 'Machine မီးမလာခြင်း',
      desc: 'Power ခလုတ်နှိပ်ပေမယ့် မီးမလာပါ။',
      steps: '1. ပလပ်ကြိုးကို သေချာစစ်ပါ။\n2. Power Supply ကို စစ်ပါ။',
      images: []
    }];
    localStorage.setItem(KEY, JSON.stringify(records));
  }

  app.innerHTML = MS.backHeader('Error Solutions') + `
    <main class="container" style="padding-top: 16px; padding-bottom: 32px;">
      
      <!-- Search -->
      <div class="input-wrap" style="margin-bottom: 20px;">
        <span class="input-wrap__icon">${MS.ICON.search}</span>
        <input type="text" id="searchInput" placeholder="Machine Name သို့မဟုတ် Error ရှာရန်..." autocomplete="off">
      </div>

      <!-- Add Button -->
      <button class="btn btn--primary" id="addBtn" style="width:100%; margin-bottom: 24px; border-radius:12px; box-shadow: 0 4px 15px rgba(229,57,53,0.4);" onclick="openForm()">
        + ဖြေရှင်းနည်း အသစ်ထည့်မည်
      </button>

      <!-- Form -->
      <div id="formWrap" style="display: none; background: var(--card); border: 1px solid var(--border); padding: 20px; border-radius: 16px; margin-bottom: 24px; box-shadow: 0 8px 20px rgba(0,0,0,0.4);">
        <div style="font-weight:900; font-size:16px; color:var(--color-primary); margin-bottom:16px;" id="formTitle">အသစ်ထည့်ရန်</div>
        
        <div class="form-group">
          <label class="form-label">Machine Name</label>
          <input type="text" id="inpMachine" class="form-input" placeholder="ဥပမာ - PRIZE RUSH">
        </div>
        <div class="form-group">
          <label class="form-label">Error အမည်</label>
          <input type="text" id="inpError" class="form-input" placeholder="ဥပမာ - မီးမလာခြင်း">
        </div>
        <div class="form-group">
          <label class="form-label">အကျဉ်းချုပ် ရှင်းလင်းချက်</label>
          <textarea id="inpDesc" class="form-input" placeholder="ဘာဖြစ်နေတာလဲ အတိုချုပ် ရေးပါ..."></textarea>
        </div>
        <div class="form-group">
          <label class="form-label">ဖြေရှင်းနည်း (အဆင့်တစ်ခုချင်း အောက်ကို ဆင်းပြီးရေးပါ)</label>
          <textarea id="inpSteps" class="form-input" placeholder="1. ပလပ်ကြိုးစစ်ပါ&#10;2. Fuse စစ်ပါ..."></textarea>
        </div>
        
        <div class="form-group">
          <label class="form-label">ပုံများ ထည့်ရန် (အများဆုံး ၅ ပုံ)</label>
          <div class="file-input-wrap">
            <div class="file-btn">${MS.ICON.upload} ပုံများ ရွေးချယ်ရန် နှိပ်ပါ</div>
            <input type="file" id="inpImages" accept="image/*" multiple onchange="handleImages(event)">
          </div>
          <div class="img-preview-list" id="previewList"></div>
        </div>

        <div style="display:flex; gap:12px; margin-top:24px;">
          <button class="btn btn-cancel" style="flex:1; border-radius:10px;" onclick="closeForm()">မလုပ်တော့ပါ</button>
          <button class="btn btn--primary" style="flex:1; border-radius:10px;" onclick="saveRecord()">သိမ်းဆည်းမည်</button>
        </div>
      </div>

      <!-- List -->
      <div id="list"></div>
    </main>
  ` + MS.bottomNav('troubleshoot');

  // Form Toggle
  window.openForm = function(editMode = false, id = null) {
    editId = id;
    document.getElementById('formWrap').style.display = 'block';
    document.getElementById('formTitle').textContent = editMode ? 'ပြင်ဆင်ရန်' : 'အသစ်ထည့်ရန်';
    document.getElementById('addBtn').style.display = 'none';
    
    if(editMode) {
      const r = records.find(x => x.id === id);
      if(r) {
        document.getElementById('inpMachine').value = r.machine;
        document.getElementById('inpError').value = r.error;
        document.getElementById('inpDesc').value = r.desc;
        document.getElementById('inpSteps').value = r.steps;
        currentImages = r.images || [];
        renderPreview();
      }
    } else {
      document.getElementById('inpMachine').value = '';
      document.getElementById('inpError').value = '';
      document.getElementById('inpDesc').value = '';
      document.getElementById('inpSteps').value = '';
      currentImages = [];
      renderPreview();
    }
  };

  window.closeForm = function() {
    document.getElementById('formWrap').style.display = 'none';
    document.getElementById('addBtn').style.display = 'block';
    editId = null;
  };

  // Images
  window.handleImages = function(event) {
    const files = event.target.files;
    if (currentImages.length + files.length > 5) {
      alert('ပုံ ၅ ပုံထက် ပိုမထည့်ပါနဲ့။');
      return;
    }

    for (let i = 0; i < files.length; i++) {
      const reader = new FileReader();
      reader.onload = function(e) {
        currentImages.push(e.target.result);
        renderPreview();
      };
      reader.readAsDataURL(files[i]);
    }
  };

  function renderPreview() {
    const preview = document.getElementById('previewList');
    preview.innerHTML = currentImages.map((img, idx) => `
      <div style="position:relative;">
        <img src="${img}" class="img-preview">
        <button onclick="removeImg(${idx})" style="position:absolute; top:-5px; right:-5px; background:red; color:#fff; border:none; border-radius:50%; width:20px; height:20px; font-size:10px; cursor:pointer;">X</button>
      </div>
    `).join('');
  }

  window.removeImg = function(idx) {
    currentImages.splice(idx, 1);
    renderPreview();
  };

  // Save
  window.saveRecord = function() {
    const machine = document.getElementById('inpMachine').value.trim();
    const error = document.getElementById('inpError').value.trim();
    const desc = document.getElementById('inpDesc').value.trim();
    const steps = document.getElementById('inpSteps').value.trim();

    if (!machine || !error || !steps) {
      alert('Machine Name, Error နှင့် ဖြေရှင်းနည်း ကို မဖြစ်မနေ ထည့်ပါ။');
      return;
    }

    if(editId) {
      // Edit
      const idx = records.findIndex(x => x.id === editId);
      if(idx >= 0) {
        records[idx] = { ...records[idx], machine: machine.toUpperCase(), error, desc, steps, images: currentImages };
      }
    } else {
      // New
      records.unshift({
        id: Date.now(), machine: machine.toUpperCase(), error, desc, steps, images: currentImages
      });
    }

    localStorage.setItem(KEY, JSON.stringify(records));
    MS.toast('သိမ်းဆည်းပြီးပါပြီ', 'ok');
    closeForm();
    render('');
  };

  // Delete
  window.deleteRecord = function(id) {
    if(!confirm('ဒီ Error ဖြေရှင်းနည်းကို ဖျက်မှာ သေချာပါသလား？')) return;
    records = records.filter(x => x.id !== id);
    localStorage.setItem(KEY, JSON.stringify(records));
    MS.toast('ဖျက်ပြီးပါပြီ', 'ok');
    render('');
  };

  // Render List
  function render(query) {
    const q = query.toLowerCase().trim();
    const filtered = records.filter(r => 
      r.machine.toLowerCase().includes(q) || 
      r.error.toLowerCase().includes(q) ||
      r.desc.toLowerCase().includes(q)
    );

    const list = document.getElementById('list');
    if (filtered.length === 0) {
      list.innerHTML = `<div class="state">
        <div class="state__icon">${MS.ICON.info}</div>
        <div class="state__title">ရှာဖွေမှု မတွေ့ပါ</div>
      </div>`;
      return;
    }

    list.innerHTML = filtered.map(r => `
      <div class="ts-card">
        <div class="ts-header" onclick="toggleBody(${r.id})">
          <div class="ts-icon">${MS.ICON.tool}</div>
          <div style="flex:1;">
            <div class="ts-machine-title">${MS.escapeHtml(r.machine)}</div>
            <div class="ts-error-title">${MS.ICON.warning} ${MS.escapeHtml(r.error)}</div>
            <div class="ts-desc">${MS.escapeHtml(r.desc)}</div>
          </div>
        </div>
        
        <div class="ts-body" id="body-${r.id}">
          <div style="font-weight:900; font-size:14px; color:var(--color-primary); margin-bottom:12px; text-transform:uppercase;">ဖြေရှင်းနည်း -</div>
          <ul class="ts-steps">
            ${r.steps.split('\n').filter(s=>s.trim()).map(s => `<li>${MS.escapeHtml(s)}</li>`).join('')}
          </ul>
          ${r.images && r.images.length > 0 ? `
            <div class="ts-img-grid">
              ${r.images.map(img => `<img src="${img}" class="ts-img" onclick="window.open(this.src)">`).join('')}
            </div>
          ` : ''}
          
          <div class="ts-actions">
            <button class="ts-btn ts-btn-edit" onclick="event.stopPropagation(); openForm(true, ${r.id})">
              ${MS.ICON.edit} ပြင်ဆင်မည်
            </button>
            <button class="ts-btn ts-btn-del" onclick="event.stopPropagation(); deleteRecord(${r.id})">
              ${MS.ICON.close} ဖျက်မည်
            </button>
          </div>
        </div>
      </div>
    `).join('');
  }

  window.toggleBody = function(id) {
    const body = document.getElementById(`body-${id}`);
    body.classList.toggle('show');
  };

  document.getElementById('searchInput').addEventListener('input', MS.debounce(e => { render(e.target.value); }, 200));
  render('');
})();
</script>
</body>
</html>

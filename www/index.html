<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0E14">
<title>MACHINE SEARCH</title>
<link rel="stylesheet" href="brand.css">
<link rel="stylesheet" href="components.css">
<link rel="stylesheet" href="bg.css">
<link rel="stylesheet" href="styles.css">
<style>
  html, body {
    height: 100%;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
  }

  .custom-header {
    position: relative;
    z-index: 10;
  }

  /* ===== 3D Cover Photo Slideshow (Full Image) ===== */
  .home-cover-wrap {
    position: relative;
    width: 100%;
    height: 240px;
    background: #141A24;
    overflow: hidden;
    border-bottom: 1px solid #2A3441;
    box-shadow: inset 0 -20px 30px rgba(0,0,0,0.8);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  
  /* နောက်ခံ မှုန်ဝါးပုံ (Blurred Background) */
  .home-cover-bg {
    position: absolute;
    inset: -20px;
    background-size: cover;
    background-position: center;
    filter: blur(15px) brightness(0.4);
    z-index: 0;
    transition: opacity 1.5s ease-in-out;
    opacity: 0;
  }
  .home-cover-bg.active { opacity: 1; }

  /* အဓိက ပုံ (Contain ဖြစ်လို့ အကုန်မြင်ရမယ်) */
  .home-cover-img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain; /* ဒီနေရာမှာ ပြောင်းထားတယ် */
    opacity: 0;
    transform: scale(0.95);
    transition: opacity 1s ease-in-out, transform 6s ease-out;
    z-index: 1;
    padding: 10px; /* အနားသတ်လေး ချန်ထားမယ် */
  }
  .home-cover-img.active {
    opacity: 1;
    transform: scale(1);
  }
  
  .home-cover-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom, rgba(10,14,20,0.1) 0%, rgba(10,14,20,0.8) 70%, rgba(10,14,20,1) 100%);
    z-index: 2;
  }
  .home-cover-content {
    position: absolute;
    inset: 0;
    z-index: 3;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 16px;
  }
  .home-cover-content h2 {
    font-size: 34px;
    font-weight: 900;
    line-height: 1.1;
    color: #fff;
    margin: 0 0 8px;
    text-shadow: 0 4px 15px rgba(0,0,0,0.9), 0 0 20px rgba(220,38,38,0.3);
  }
  .home-cover-content h2 .accent { color: #EF4444; }
  .home-cover-content p {
    color: #E2E8F0;
    font-size: 14px;
    margin: 0;
    text-shadow: 0 2px 10px rgba(0,0,0,0.9);
  }

  .home-search-wrap {
    padding: 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: -32px;
    position: relative;
    z-index: 5;
  }
  .home-search-box {
    flex: 1;
    display: flex;
    align-items: center;
    background: #141A24;
    border: 2px solid #DC2626;
    border-radius: 30px;
    padding: 0 16px;
    height: 56px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.6), 0 0 15px rgba(220,38,38,0.3), inset 0 2px 5px rgba(255,255,255,0.05);
    text-decoration: none;
    transition: transform 0.2s;
  }
  .home-search-box:active { transform: scale(0.98); }
  .home-search-box__icon { color: #fff; display: flex; margin-right: 12px; }
  .home-search-box__icon svg { width: 22px !important; height: 22px !important; }
  .home-search-box__input {
    flex: 1;
    background: transparent;
    border: none;
    color: #64748B;
    font-size: 15px;
    outline: none;
  }
  .home-search-box__filter {
    color: #fff;
    display: flex;
    margin-left: 12px;
    padding-left: 12px;
    border-left: 1px solid rgba(255,255,255,0.1);
  }
  .home-search-box__filter svg { width: 20px !important; height: 20px !important; }

  .home-stats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    padding: 0 16px 24px;
  }
  .home-stat-card {
    background: linear-gradient(145deg, #1C2330, #141A24);
    border: 1px solid #2A3441;
    border-radius: 14px;
    padding: 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: 0 8px 15px rgba(0,0,0,0.4), inset 0 1px 1px rgba(255,255,255,0.05);
  }
  .home-stat-card--red { border-color: rgba(220,38,38,0.4); }
  .home-stat-card--gold { border-color: rgba(245,158,11,0.4); }
  .home-stat-card__icon { width: 40px; height: 40px; display: grid; place-items: center; flex-shrink: 0; }
  .home-stat-card__icon svg { width: 32px !important; height: 32px !important; }
  .home-stat-card__icon--red { color: #fff; }
  .home-stat-card__icon--gold { color: #F59E0B; }
  .home-stat-card__divider { width: 1px; height: 32px; background: rgba(255,255,255,0.1); }
  .home-stat-card__info { display: flex; flex-direction: column; }
  .home-stat-card__label {
    font-size: 10px;
    font-weight: 800;
    color: #94A3B8;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 2px;
  }
  .home-stat-card__value { font-size: 20px; font-weight: 900; color: #fff; line-height: 1; text-shadow: 0 2px 5px rgba(0,0,0,0.5); }
  .home-stat-card__value--gold { color: #F59E0B; font-size: 14px; margin-top: 2px; }

  .section-header-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    margin-bottom: 12px;
  }
  .section-header-row .title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 18px;
    font-weight: 800;
    color: #fff;
    text-shadow: 0 2px 4px rgba(0,0,0,0.5);
  }
  .section-header-row .title::before {
    content: '';
    width: 4px;
    height: 18px;
    background: #DC2626;
    border-radius: 2px;
    box-shadow: 0 0 10px rgba(220,38,38,0.5);
  }
  .section-header-row .arrow { color: #64748B; }
  .section-header-row .arrow svg { width: 20px !important; height: 20px !important; }

  .home-quick-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    padding: 0 16px 24px;
  }
  .home-quick-card {
    background: linear-gradient(145deg, #1C2330, #141A24);
    border: 1px solid #2A3441;
    border-radius: 14px;
    padding: 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    text-decoration: none;
    color: #fff;
    box-shadow: 0 8px 15px rgba(0,0,0,0.4), inset 0 1px 1px rgba(255,255,255,0.05);
    transition: transform 0.2s, background 0.2s;
  }
  .home-quick-card:active { transform: scale(0.96); }
  .home-quick-card--red-border {
    border-color: rgba(220,38,38,0.5);
    background: linear-gradient(145deg, rgba(220,38,38,0.1), #141A24);
  }
  .home-quick-card__icon { width: 24px; height: 24px; display: grid; place-items: center; flex-shrink: 0; }
  .home-quick-card__icon svg { width: 24px !important; height: 24px !important; }
  .home-quick-card__icon--grey { color: #CBD5E1; }
  .home-quick-card__icon--red { color: #EF4444; filter: drop-shadow(0 0 5px rgba(220,38,38,0.5)); }
  .home-quick-card__divider { width: 1px; height: 24px; background: rgba(255,255,255,0.1); }
  .home-quick-card__title { flex: 1; font-size: 15px; font-weight: 700; }
  .home-quick-card__arrow { color: #64748B; display: flex; }
  .home-quick-card__arrow svg { width: 16px !important; height: 16px !important; }

  .home-how {
    margin: 0 16px 24px;
    background: linear-gradient(145deg, #1C2330, #141A24);
    border: 1px solid #2A3441;
    border-radius: 14px;
    padding: 16px;
    box-shadow: 0 8px 15px rgba(0,0,0,0.4);
  }
  .home-how__header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }
  .home-how__title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    font-weight: 800;
    color: #fff;
    letter-spacing: 0.5px;
  }
  .home-how__title::before {
    content: '';
    width: 3px;
    height: 14px;
    background: #DC2626;
    border-radius: 2px;
  }
  .home-how__info { color: #64748B; }
  .home-how__info svg { width: 18px !important; height: 18px !important; }
  .home-how__steps {
    display: flex;
    justify-content: space-between;
    position: relative;
  }
  .home-how__steps::before {
    content: '';
    position: absolute;
    top: 16px;
    left: 15%;
    right: 15%;
    height: 1px;
    background: #2A3441;
    z-index: 0;
  }
  .home-how__step {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    position: relative;
    z-index: 1;
  }
  .home-how__num {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: linear-gradient(135deg, #EF4444, #990B24);
    color: #fff;
    display: grid;
    place-items: center;
    font-size: 14px;
    font-weight: 900;
    margin-bottom: 12px;
    border: 4px solid #141A24;
    box-shadow: 0 0 0 1px #2A3441, 0 5px 10px rgba(220,38,38,0.4);
  }
  .home-how__text {
    font-size: 12px;
    color: #CBD5E1;
    line-height: 1.3;
    font-weight: 600;
    max-width: 80px;
  }
</style>
</head>
<body>
<div id="app"></div>
<script src="app.js?v=1008"></script>
<script>
(async function () {
  const app = document.getElementById('app');

  let data;
  try {
    data = await MS.loadData();
  } catch (e) {
    app.innerHTML = MS.header() +
      '<main class="container">' +
        '<div class="state" style="padding-top:40px;">' +
          '<div class="state__icon">' + MS.ICON.warning + '</div>' +
          '<div class="state__title">Database load failed</div>' +
        '</div>' +
      '</main>' +
      MS.bottomNav('home');
    return;
  }

  const machines = data.machines || [];
  const has = data.meta && data.meta.filename !== '—';
  const count = machines.length;
  const covers = JSON.parse(localStorage.getItem('ms_covers_v1') || '[]');

  // Build Cover Slideshow HTML
  let slideshowHtml = '';
  if (covers.length > 0) {
    slideshowHtml = '<div class="home-cover-wrap" id="coverWrap">' +
      covers.map((c, i) => `
        <div class="home-cover-bg ${i === 0 ? 'active' : ''}" style="background-image: url('${c}')"></div>
        <img src="${c}" class="home-cover-img ${i === 0 ? 'active' : ''}">
      `).join('') +
      '<div class="home-cover-overlay"></div>' +
      '<div class="home-cover-content">' +
        '<h2>Find your <span class="accent">machine.</span></h2>' +
        '<p>Search names, codes & locations.</p>' +
      '</div>' +
    '</div>';
  } else {
    slideshowHtml = '<div class="home-hero" style="padding:32px 16px 16px; text-align:center;">' +
      '<h2 style="font-size:32px; font-weight:900; color:#fff; margin:0 0 8px;">Find your <span style="color:#EF4444;">machine.</span></h2>' +
      '<p style="color:#94A3B8; font-size:14px; margin:0;">Search names, codes & locations.</p>' +
    '</div>';
  }

  app.innerHTML = 
    '<header class="back-header" style="border-bottom:none; justify-content:space-between; padding-right:16px;">' +
      '<div style="display:flex; align-items:center; gap:12px;">' +
        '<div class="custom-header__brand">' +
          '<svg class="custom-header__logo" style="width:32px;height:32px;" viewBox="0 0 100 100" fill="none"><path d="M50 10 L85 30 L85 70 L50 90 L15 70 L15 30 Z" stroke="#DC2626" stroke-width="6" fill="none"/><circle cx="50" cy="50" r="15" stroke="#DC2626" stroke-width="6" fill="none"/><path d="M65 65 L80 80" stroke="#DC2626" stroke-width="6" stroke-linecap="round"/></svg>' +
          '<div class="custom-header__text">' +
            '<div class="custom-header__name" style="font-size:16px;">MACHINE <span style="color:#EF4444;">SEARCH</span></div>' +
            '<div class="custom-header__tag" style="font-size:9px;">OFFLINE DATABASE</div>' +
          '</div>' +
        '</div>' +
      '</div>' +
      '<a href="settings.html" class="custom-header__settings" style="width:36px;height:36px;">' + MS.ICON.settings + '</a>' +
    '</header>' +

    '<main style="padding-bottom: 80px;">' +
      
      slideshowHtml +

      // Search Box
      '<div class="home-search-wrap">' +
        '<a href="search.html" class="home-search-box">' +
          '<span class="home-search-box__icon">' + MS.ICON.search + '</span>' +
          '<input type="text" class="home-search-box__input" placeholder="Search machine or code..." readonly style="cursor:pointer;">' +
          '<span class="home-search-box__filter">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="21" x2="4" y2="14"></line><line x1="4" y1="10" x2="4" y2="3"></line><line x1="12" y1="21" x2="12" y2="12"></line><line x1="12" y1="8" x2="12" y2="3"></line><line x1="20" y1="21" x2="20" y2="16"></line><line x1="20" y1="12" x2="20" y2="3"></line><line x1="1" y1="14" x2="7" y2="14"></line><line x1="9" y1="8" x2="15" y2="8"></line><line x1="17" y1="16" x2="23" y2="16"></line></svg>' +
          '</span>' +
        '</a>' +
      '</div>' +

      // Stats Cards
      '<div class="home-stats-grid">' +
        '<div class="home-stat-card home-stat-card--red">' +
          '<div class="home-stat-card__icon home-stat-card__icon--red">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M7 12h.01M12 12h.01M17 12h.01"/><path d="M7 8h.01M12 8h.01M17 8h.01"/><path d="M7 16h.01M12 16h.01M17 16h.01"/></svg>' +
          '</div>' +
          '<div class="home-stat-card__divider"></div>' +
          '<div class="home-stat-card__info">' +
            '<div class="home-stat-card__label">MACHINES</div>' +
            '<div class="home-stat-card__value">' + (has ? count.toLocaleString() : '0') + '</div>' +
          '</div>' +
        '</div>' +
        '<div class="home-stat-card home-stat-card--gold">' +
          '<div class="home-stat-card__icon home-stat-card__icon--gold">' + MS.ICON.database + '</div>' +
          '<div class="home-stat-card__divider"></div>' +
          '<div class="home-stat-card__info">' +
            '<div class="home-stat-card__label">DATABASE</div>' +
            '<div class="home-stat-card__value home-stat-card__value--gold">LOCAL · OFFLINE</div>' +
          '</div>' +
        '</div>' +
      '</div>' +

      // Quick Access Header
      '<div class="section-header-row">' +
        '<div class="title">Quick Access</div>' +
        '<a href="database.html" class="arrow" style="color:#64748B;text-decoration:none;">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>' +
        '</a>' +
      '</div>' +

      // Quick Access Grid
      '<div class="home-quick-grid">' +
        '<a href="database.html" class="home-quick-card">' +
          '<div class="home-quick-card__icon home-quick-card__icon--grey">' + MS.ICON.database + '</div>' +
          '<div class="home-quick-card__divider"></div>' +
          '<div class="home-quick-card__title">Database</div>' +
          '<div class="home-quick-card__arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></div>' +
        '</a>' +
        '<a href="favorites.html" class="home-quick-card">' +
          '<div class="home-quick-card__icon home-quick-card__icon--red">' + MS.ICON.star + '</div>' +
          '<div class="home-quick-card__divider"></div>' +
          '<div class="home-quick-card__title">Favorites</div>' +
          '<div class="home-quick-card__arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></div>' +
        '</a>' +
        '<a href="history.html" class="home-quick-card">' +
          '<div class="home-quick-card__icon home-quick-card__icon--grey">' + MS.ICON.clock + '</div>' +
          '<div class="home-quick-card__divider"></div>' +
          '<div class="home-quick-card__title">History</div>' +
          '<div class="home-quick-card__arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></div>' +
        '</a>' +
        '<a href="import.html" class="home-quick-card home-quick-card--red-border">' +
          '<div class="home-quick-card__icon home-quick-card__icon--red">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="16" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>' +
          '</div>' +
          '<div class="home-quick-card__divider"></div>' +
          '<div class="home-quick-card__title">Import Excel</div>' +
          '<div class="home-quick-card__arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></div>' +
        '</a>' +
      '</div>' +

      // How It Works
      '<div class="home-how">' +
        '<div class="home-how__header">' +
          '<div class="home-how__title">HOW IT WORKS</div>' +
          '<a href="help.html" class="home-how__info" style="text-decoration:none;">' + MS.ICON.info + '</a>' +
        '</div>' +
        '<div class="home-how__steps">' +
          '<div class="home-how__step">' +
            '<div class="home-how__num">1</div>' +
            '<div class="home-how__text">Search machine code</div>' +
          '</div>' +
          '<div class="home-how__step">' +
            '<div class="home-how__num">2</div>' +
            '<div class="home-how__text">Copy instantly</div>' +
          '</div>' +
          '<div class="home-how__step">' +
            '<div class="home-how__num">3</div>' +
            '<div class="home-how__text">Works offline</div>' +
          '</div>' +
        '</div>' +
      '</div>' +

    '</main>' +
    MS.bottomNav('home');

  // ===== Slideshow Logic =====
  if (covers.length > 1) {
    let currentIndex = 0;
    const imgs = document.querySelectorAll('.home-cover-img');
    const bgs = document.querySelectorAll('.home-cover-bg');
    
    setInterval(() => {
      imgs[currentIndex].classList.remove('active');
      bgs[currentIndex].classList.remove('active');
      
      currentIndex = (currentIndex + 1) % covers.length;
      
      imgs[currentIndex].classList.add('active');
      bgs[currentIndex].classList.add('active');
    }, 5000); // 5 စက္ကန့်တစ်ခါ ပြောင်းမယ်
  }

})();
</script>
</body>
</html>

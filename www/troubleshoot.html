<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0E14">
<title>Solution Center — MACHINE SEARCH</title>
<link rel="stylesheet" href="brand.css">
<link rel="stylesheet" href="components.css">
<link rel="stylesheet" href="bg.css">
<link rel="stylesheet" href="styles.css">
<style>
  /* ===== TROUBLESHOOT SPECIFIC ===== */
  .ts-hero {
    background: linear-gradient(90deg, rgba(220,38,38,0.1) 0%, transparent 100%);
    border-bottom: 1px solid rgba(220,38,38,0.2);
    padding: 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .ts-hero__left { display: flex; align-items: center; gap: 12px; }
  .ts-hero__icon {
    width: 56px; height: 56px; border-radius: 50%;
    background: radial-gradient(circle, #DC2626, #990B24);
    display: grid; place-items: center; color: #fff; box-shadow: 0 0 20px rgba(220,38,38,0.4);
  }
  .ts-hero__icon svg { width: 28px !important; height: 28px !important; }
  .ts-hero__title { font-size: 20px; font-weight: 900; color: #fff; line-height: 1.1; }
  .ts-hero__title span { color: #EF4444; }
  .ts-hero__sub { font-size: 12px; color: #94A3B8; margin-top: 4px; }
  .ts-hero__right {
    background: #141A24; border: 1px solid rgba(245,158,11,0.3);
    border-radius: 10px; padding: 8px 12px; display: flex; align-items: center; gap: 8px; text-decoration: none;
  }
  .ts-hero__right svg { color: #F59E0B; width: 20px !important; height: 20px !important; }
  .ts-hero__right-text { display: flex; flex-direction: column; }
  .ts-hero__right-text b { color: #fff; font-size: 11px; }
  .ts-hero__right-text span { color: #94A3B8; font-size: 10px; }

  .ts-search-wrap { padding: 16px; display: flex; gap: 10px; position: sticky; top: 60px; z-index: 30; background: #0A0E14; }
  .ts-search-box {
    flex: 1; display: flex; align-items: center;
    background: #141A24; border: 1.5px solid #DC2626; border-radius: 30px; padding: 0 16px; height: 52px;
  }
  .ts-search-box svg { color: #fff; margin-right: 10px; width: 20px !important; height: 20px !important; }
  .ts-search-box input { flex: 1; background: transparent; border: none; color: #fff; font-size: 15px; outline: none; }
  .ts-search-box input::placeholder { color: #64748B; }
  .ts-filter-btn {
    width: 52px; height: 52px; border-radius: 14px;
    background: #141A24; border: 1.5px solid #DC2626;
    display: grid; place-items: center; color: #fff; text-decoration: none;
  }
  .ts-filter-btn svg { width: 24px !important; height: 24px !important; }

  .ts-stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; padding: 0 16px 16px; }
  .ts-stat {
    background: #141A24; border: 1px solid #2A3441; border-radius: 12px;
    padding: 12px; display: flex; align-items: center; gap: 10px;
  }
  .ts-stat__icon { width: 32px; height: 32px; display: grid; place-items: center; }
  .ts-stat__icon svg { width: 28px !important; height: 28px !important; }
  .ts-stat__icon--red { color: #EF4444; }
  .ts-stat__icon--green { color: #22C55E; }
  .ts-stat__icon--grey { color: #fff; }
  .ts-stat__info { display: flex; flex-direction: column; }
  .ts-stat__v { font-size: 18px; font-weight: 900; color: #fff; line-height: 1; }
  .ts-stat__l { font-size: 10px; color: #94A3B8; margin-top: 2px; }

  .ts-list-header { display: flex; align-items: center; justify-content: space-between; padding: 0 16px 12px; margin-top: 16px; }
  .ts-list-title { display: flex; align-items: center; gap: 8px; font-size: 18px; font-weight: 900; color: #fff; }
  .ts-list-title::before { content: ''; width: 4px; height: 18px; background: #DC2626; border-radius: 2px; }
  .ts-list-total { font-size: 12px; font-weight: 700; color: #94A3B8; background: #141A24; padding: 4px 10px; border-radius: 6px; }

  .ts-list-item {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 12px 16px; background: #141A24;
    border-bottom: 1px solid #2A3441; text-decoration: none;
    cursor: pointer; transition: background 0.15s;
  }
  .ts-list-item:hover { background: #1C2330; }
  .ts-list-item:last-child { border-bottom: none; }
  .ts-list-item__img {
    width: 60px; height: 60px; border-radius: 8px; object-fit: cover;
    border: 1px solid #2A3441; flex-shrink: 0; background: #1C2330;
  }
  .ts-list-item__content { flex: 1; min-width: 0; padding-top: 2px; }
  .ts-list-item__title { font-size: 15px; font-weight: 800; color: #fff; margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ts-list-item__meta { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .ts-meta-pill {
    display: inline-flex; align-items: center; gap: 4px;
    background: #1C2330; padding: 4px 8px; border-radius: 4px;
    font-size: 11px; font-weight: 700; color: #CBD5E1;
  }
  .ts-meta-pill--brand { color: #EF4444; }
  .ts-list-item__desc { font-size: 12px; color: #64748B; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .ts-list-item__actions { display: flex; flex-direction: column; gap: 4px; }
  .ts-action-btn { 
    background: #1C2330; color: #fff; border: 1px solid #2A3441;
    padding: 4px 10px; border-radius: 6px; font-size: 10px; font-weight: 800; cursor: pointer;
  }
  .ts-action-btn:hover { background: #2A3441; }
  .ts-action-btn--delete { color: #EF4444; border-color: rgba(239,68,68,0.3); }
  .ts-action-btn--delete:hover { background: rgba(239,68,68,0.1); }

  .ts-empty {
    text-align: center; padding: 40px 20px; color: #64748B;
    background: #141A24; border: 1px dashed #2A3441; border-radius: 12px; margin: 0 16px;
  }
  .ts-empty svg { width: 48px !important; height: 48px !important; margin-bottom: 12px; opacity: 0.5; }
  .ts-empty p { font-size: 14px; margin: 0; }

  .ts-bottom-actions { display: flex; background: #141A24; border: 1px solid #2A3441; border-radius: 12px; margin: 24px 16px; padding: 12px 0; }
  .ts-action { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; border-right: 1px solid #2A3441; text-decoration: none; color: #fff; cursor: pointer; background: transparent; border-top: none; border-bottom: none; border-left: none;}
  .ts-action:last-child { border-right: none; }
  .ts-action svg { width: 24px !important; height: 24px !important; }
  .ts-action__title { font-size: 13px; font-weight: 800; }
  .ts-action__sub { font-size: 10px; color: #64748B; }

  /* ===== MODALS ===== */
  .ms-modal {
    position: fixed; inset: 0; background: rgba(0,0,0,0.85);
    z-index: 9999; display: none; align-items: center; justify-content: center;
    padding: 16px; backdrop-filter: blur(4px);
  }
  .ms-modal.show { display: flex; }
  .ms-modal__content {
    background: #141A24; border: 1px solid #2A3441; border-radius: 16px;
    width: 100%; max-width: 400px; padding: 24px; position: relative;
    max-height: 90vh; overflow-y: auto;
  }
  .ms-modal__title { font-size: 18px; font-weight: 900; color: #fff; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; }
  .ms-modal__close { background: none; border: none; color: #94A3B8; cursor: pointer; padding: 4px; }
  .ms-modal__close svg { width: 20px !important; height: 20px !important; }

  .ms-form-group { margin-bottom: 12px; }
  .ms-form-group label { display: block; font-size: 12px; color: #94A3B8; margin-bottom: 4px; font-weight: 700; }
  .ms-form-input, .ms-form-textarea {
    width: 100%; background: #1C2330; border: 1px solid #2A3441;
    border-radius: 8px; padding: 10px 12px; color: #fff; font-size: 14px;
    font-family: inherit; outline: none;
  }
  .ms-form-input:focus, .ms-form-textarea:focus { border-color: #DC2626; }
  .ms-form-textarea { min-height: 80px; resize: vertical; }
  .ms-modal__actions { display: flex; gap: 8px; margin-top: 20px; }
  .ms-btn { flex: 1; height: 40px; border-radius: 8px; font-size: 14px; font-weight: 800; cursor: pointer; border: none; }
  .ms-btn--cancel { background: #1C2330; color: #fff; border: 1px solid #2A3441; }
  .ms-btn--save { background: #DC2626; color: #fff; }

  .ms-upload-area {
    border: 2px dashed #2A3441; border-radius: 8px; padding: 16px;
    text-align: center; cursor: pointer; background: #1C2330;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
  }
  .ms-upload-area:hover { border-color: #DC2626; }
  .ms-upload-area svg { width: 24px !important; height: 24px !important; color: #DC2626; }
  .ms-upload-area span { font-size: 12px; color: #94A3B8; }
  .ms-preview-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .ms-preview-img { width: 60px; height: 60px; border-radius: 6px; object-fit: cover; border: 1px solid #2A3441; position: relative; }
  .ms-preview-img-wrap { position: relative; }
  .ms-preview-img-remove {
    position: absolute; top: -4px; right: -4px; width: 18px; height: 18px;
    background: #EF4444; color: #fff; border-radius: 50%; border: none;
    font-size: 10px; cursor: pointer; display: grid; place-items: center;
  }

  /* ===== VIEW MODAL (Details) ===== */
  .ms-view-images { display: flex; gap: 8px; overflow-x: auto; margin-bottom: 16px; padding-bottom: 4px; }
  .ms-view-images img { height: 160px; border-radius: 8px; object-fit: cover; cursor: pointer; border: 1px solid #2A3441; }
  .ms-view-images img:hover { border-color: #DC2626; }
  .ms-view-solution { font-size: 14px; color: #CBD5E1; line-height: 1.6; background: #1C2330; padding: 14px; border-radius: 8px; }

  /* ===== FULL SCREEN IMAGE VIEWER (Lightbox) ===== */
  .ms-image-viewer {
    position: fixed; inset: 0; background: #000;
    z-index: 99999; display: none; align-items: center; justify-content: center;
  }
  .ms-image-viewer.show { display: flex; }
  .ms-image-viewer img {
    max-width: 100%; max-height: 100vh; object-fit: contain;
  }
  .ms-image-viewer__close {
    position: absolute; top: 20px; right: 20px;
    width: 40px; height: 40px; border-radius: 50%;
    background: rgba(255,255,255,0.1); color: #fff;
    border: none; font-size: 20px; cursor: pointer;
    display: grid; place-items: center;
  }

  /* ===== ALERT MODALS (Custom) ===== */
  .ms-alert-modal {
    position: fixed; inset: 0; background: rgba(0,0,0,0.85);
    z-index: 10000; display: none; align-items: center; justify-content: center; padding: 24px; backdrop-filter: blur(4px);
  }
  .ms-alert-modal.show { display: flex; }
  .ms-alert-box {
    background: #141A24; border: 1px solid #DC2626; border-radius: 16px;
    width: 100%; max-width: 320px; padding: 24px; text-align: center;
    box-shadow: 0 10px 40px rgba(220,38,38,0.2);
  }
  .ms-alert-icon {
    width: 56px; height: 56px; border-radius: 50%;
    background: rgba(220,38,38,0.1); color: #DC2626;
    display: grid; place-items: center; margin: 0 auto 16px;
  }
  .ms-alert-icon svg { width: 32px !important; height: 32px !important; }
  .ms-alert-title { font-size: 18px; font-weight: 900; color: #fff; margin-bottom: 8px; }
  .ms-alert-text { font-size: 13px; color: #94A3B8; line-height: 1.5; margin-bottom: 24px; }
  .ms-alert-actions { display: flex; gap: 8px; }
  .ms-alert-btn {
    flex: 1; height: 44px; border-radius: 8px; font-size: 15px; font-weight: 800; border: none; cursor: pointer;
  }
  .ms-alert-btn--cancel { background: #1C2330; color: #fff; border: 1px solid #2A3441; }
  .ms-alert-btn--confirm { background: #DC2626; color: #fff; }
</style>
</head>
<body>
<div id="app"></div>

<!-- Add / Edit Solution Modal -->
<div class="ms-modal" id="solutionModal">
  <div class="ms-modal__content">
    <div class="ms-modal__title">
      <span id="modalTitleText">Add New Solution</span>
      <button class="ms-modal__close" id="closeModalBtn">✕</button>
    </div>
    
    <input type="hidden" id="solId">
    
    <div class="ms-form-group">
      <label>Machine Name *</label>
      <input type="text" class="ms-form-input" id="solMachine" placeholder="e.g. Prize Rush">
    </div>
    <div class="ms-form-group">
      <label>Error Name *</label>
      <input type="text" class="ms-form-input" id="solError" placeholder="e.g. Screen No Display">
    </div>
    <div class="ms-form-group">
      <label>Solution / ဖြေရှင်းနည်း *</label>
      <textarea class="ms-form-textarea" id="solSolution" placeholder="Check video cable..."></textarea>
    </div>
    <div class="ms-form-group">
      <label>Photos (Auto-compressed)</label>
      <div class="ms-upload-area" id="uploadArea">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        <span>Tap to select photos</span>
      </div>
      <input type="file" id="solImages" accept="image/*" multiple style="display: none;">
      <div class="ms-preview-grid" id="previewGrid"></div>
    </div>

    <div class="ms-modal__actions">
      <button class="ms-btn ms-btn--cancel" id="cancelModalBtn">Cancel</button>
      <button class="ms-btn ms-btn--save" id="saveSolutionBtn">Save</button>
    </div>
  </div>
</div>

<!-- View Details Modal -->
<div class="ms-modal" id="viewModal">
  <div class="ms-modal__content">
    <div class="ms-modal__title">
      <span>Solution Details</span>
      <button class="ms-modal__close" id="closeViewBtn">✕</button>
    </div>
    <div id="viewContent"></div>
    <div class="ms-modal__actions">
      <button class="ms-btn ms-btn--cancel" id="closeViewActionBtn">Close</button>
    </div>
  </div>
</div>

<!-- Image Lightbox (Full Screen) -->
<div class="ms-image-viewer" id="imageViewer">
  <button class="ms-image-viewer__close" id="closeImageViewer">✕</button>
  <img id="viewerImg" src="" alt="Preview">
</div>

<!-- Custom Alert / Confirm Modal -->
<div class="ms-alert-modal" id="customAlert">
  <div class="ms-alert-box">
    <div class="ms-alert-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
    </div>
    <div class="ms-alert-title" id="alertTitle">Error</div>
    <div class="ms-alert-text" id="alertText">Message</div>
    <div class="ms-alert-actions">
      <button class="ms-alert-btn ms-alert-btn--cancel" id="alertCancelBtn" style="display:none;">Cancel</button>
      <button class="ms-alert-btn ms-alert-btn--confirm" id="alertOkBtn">OK</button>
    </div>
  </div>
</div>

<script src="app.js?v=1007"></script>
<script>
(function () {
  const app = document.getElementById('app');
  
  const solutionModal = document.getElementById('solutionModal');
  const viewModal = document.getElementById('viewModal');
  const alertModal = document.getElementById('customAlert');
  const imageViewer = document.getElementById('imageViewer');
  const viewerImg = document.getElementById('viewerImg');
  const fileInput = document.getElementById('solImages');
  const previewGrid = document.getElementById('previewGrid');
  
  const SOL_KEY = 'ms_solutions_v1';
  let currentImages = [];
  let searchQuery = '';

  // ===== Android Back Button Logic for Modals =====
  // ဖုန်းရဲ့ Back ကို နှိပ်လိုက်ရင် Modal တွေ ပိတ်သွားအောင် လုပ်မယ် (Home ကို မရောက်စေရ)
  window.addEventListener('popstate', function(event) {
    // ဖွင့်ထားတဲ့ Modal တွေ ရှိမရှိ စစ်မယ်
    if (imageViewer.classList.contains('show')) {
      imageViewer.classList.remove('show');
      history.pushState({ modal: 'troubleshoot' }, '', location.href); // history ကို ပြန်ထည့်မယ်
      return;
    }
    if (alertModal.classList.contains('show')) {
      alertModal.classList.remove('show');
      history.pushState({ modal: 'troubleshoot' }, '', location.href);
      return;
    }
    if (viewModal.classList.contains('show')) {
      viewModal.classList.remove('show');
      history.pushState({ modal: 'troubleshoot' }, '', location.href);
      return;
    }
    if (solutionModal.classList.contains('show')) {
      solutionModal.classList.remove('show');
      history.pushState({ modal: 'troubleshoot' }, '', location.href);
      return;
    }
    // တခြား Modal မရှိရင် ပြန်ထွက်မယ်
    history.back();
  });

  // Page စဝင်တာနဲ့ history ကို တစ်ခါ ထည့်ထားမယ်
  history.pushState({ modal: 'troubleshoot' }, '', location.href);

  // ===== Custom Alert Functions =====
  function showAlert(title, text, isConfirm = false, onConfirm) {
    document.getElementById('alertTitle').textContent = title;
    document.getElementById('alertText').textContent = text;
    const cancelBtn = document.getElementById('alertCancelBtn');
    const okBtn = document.getElementById('alertOkBtn');
    
    if (isConfirm) {
      cancelBtn.style.display = 'block';
      okBtn.textContent = 'Yes, Delete';
      okBtn.style.background = '#EF4444';
      okBtn.onclick = () => { alertModal.classList.remove('show'); if (onConfirm) onConfirm(); };
    } else {
      cancelBtn.style.display = 'none';
      okBtn.textContent = 'OK';
      okBtn.style.background = '#DC2626';
      okBtn.onclick = () => alertModal.classList.remove('show');
    }
    alertModal.classList.add('show');
  }
  document.getElementById('alertCancelBtn').onclick = () => alertModal.classList.remove('show');

  // ===== Storage Functions =====
  function getSolutions() {
    try { return JSON.parse(localStorage.getItem(SOL_KEY) || '[]'); } catch { return []; }
  }
  function saveSolutions(sols) {
    try { localStorage.setItem(SOL_KEY, JSON.stringify(sols)); return true; }
    catch(e) { showAlert('Storage Full', 'Storage limit exceeded! Please use smaller or fewer images.'); return false; }
  }

  // ===== Icons =====
  const iconFilter = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="21" x2="4" y2="14"></line><line x1="4" y1="10" x2="4" y2="3"></line><line x1="12" y1="21" x2="12" y2="12"></line><line x1="12" y1="8" x2="12" y2="3"></line><line x1="20" y1="21" x2="20" y2="16"></line><line x1="20" y1="12" x2="20" y2="3"></line><line x1="1" y1="14" x2="7" y2="14"></line><line x1="9" y1="8" x2="15" y2="8"></line><line x1="17" y1="16" x2="23" y2="16"></line></svg>';
  const iconWrench = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>';
  const iconBulb = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-7 7c0 2.4 1.2 4.5 3 5.7V17h8v-2.3c1.8-1.2 3-3.3 3-5.7a7 7 0 0 0-7-7z"/></svg>';
  const iconSlots = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M7 12h.01M12 12h.01M17 12h.01"/><path d="M7 8h.01M12 8h.01M17 8h.01"/><path d="M7 16h.01M12 16h.01M17 16h.01"/></svg>';
  const iconPlus = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>';
  const iconBook = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>';
const iconInfoCircle = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v5h1" stroke-linecap="round"/></svg>';
  const iconFile = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>';

  // ===== Main UI Render =====
  async function renderUI() {
    let allSolutions = getSolutions();
    
    let displaySolutions = allSolutions;
    if (searchQuery) {
      const q = searchQuery.toLowerCase();
      displaySolutions = allSolutions.filter(s => 
        (s.machine || '').toLowerCase().includes(q) || 
        (s.error || '').toLowerCase().includes(q) ||
        (s.solution || '').toLowerCase().includes(q)
      );
    }

    const uniqueMachines = new Set(allSolutions.map(s => (s.machine || '').toLowerCase().trim())).size;

    app.innerHTML =
      '<header class="back-header" style="border-bottom:none; justify-content:space-between; padding-right:16px;">' +
        '<div style="display:flex; align-items:center; gap:12px;">' +
          '<a href="index.html" class="back-header__back" aria-label="Back">' + MS.ICON.back + '</a>' +
          '<div class="custom-header__brand">' +
            '<svg class="custom-header__logo" style="width:32px;height:32px;" viewBox="0 0 100 100" fill="none"><path d="M50 10 L85 30 L85 70 L50 90 L15 70 L15 30 Z" stroke="#DC2626" stroke-width="6" fill="none"/><circle cx="50" cy="50" r="15" stroke="#DC2626" stroke-width="6" fill="none"/><path d="M65 65 L80 80" stroke="#DC2626" stroke-width="6" stroke-linecap="round"/></svg>' +
            '<div class="custom-header__text">' +
              '<div class="custom-header__name" style="font-size:16px;">MACHINE <span style="color:#EF4444;">SEARCH</span></div>' +
              '<div class="custom-header__tag" style="font-size:9px;">OFFLINE DATABASE</div>' +
            '</div>' +
          '</div>' +
        '</div>' +
        '<a href="settings.html" class="custom-header__settings" style="width:36px;height:36px;">' + MS.ICON.settings + '</a>' +
      '</header>' +

      '<main style="padding-bottom: 100px;">' +
        // Search Bar (Sticky)
        '<div class="ts-search-wrap">' +
          '<div class="ts-search-box">' +
            MS.ICON.search +
            '<input type="text" id="tsSearchInput" placeholder="Search machine, error or solution..." value="' + MS.escapeHtml(searchQuery) + '">' +
          '</div>' +
          '<a href="#" class="ts-filter-btn">' + iconFilter + '</a>' +
        '</div>' +

        (!searchQuery ? 
          '<div class="ts-hero">' +
            '<div class="ts-hero__left">' +
              '<div class="ts-hero__icon">' + iconWrench + '</div>' +
              '<div>' +
                '<div class="ts-hero__title">Solution <span>Center</span></div>' +
                '<div class="ts-hero__sub">Find solutions to machine issues</div>' +
              '</div>' +
            '</div>' +
            '<a href="help.html" class="ts-hero__right">' +
              iconBulb +
              '<div class="ts-hero__right-text"><b>Smart Help</b><span>Quick & Easy</span></div>' +
            '</a>' +
          '</div>' +

          '<div class="ts-stats">' +
            '<div class="ts-stat">' +
              '<div class="ts-stat__icon ts-stat__icon--grey">' + iconSlots + '</div>' +
              '<div class="ts-stat__info"><div class="ts-stat__v">' + uniqueMachines + '</div><div class="ts-stat__l">Machines</div></div>' +
            '</div>' +
            '<div class="ts-stat">' +
              '<div class="ts-stat__icon ts-stat__icon--red">' + iconFile + '</div>' +
              '<div class="ts-stat__info"><div class="ts-stat__v">' + allSolutions.length + '</div><div class="ts-stat__l">Errors</div></div>' +
            '</div>' +
            '<div class="ts-stat">' +
              '<div class="ts-stat__icon ts-stat__icon--green">' + iconFile + '</div>' +
              '<div class="ts-stat__info"><div class="ts-stat__v">' + allSolutions.length + '</div><div class="ts-stat__l">Solutions</div></div>' +
            '</div>' +
          '</div>'
        : '') +

        '<div class="ts-list-header">' +
          '<div class="ts-list-title">' + (searchQuery ? 'Search Results' : 'Solution List') + '</div>' +
          '<div class="ts-list-total">Found: ' + displaySolutions.length + '</div>' +
        '</div>' +

        (displaySolutions.length === 0 
          ? '<div class="ts-empty">' + iconFile + '<p>' + (searchQuery ? 'No matching solutions found.' : 'No solutions yet. Tap "Add Solution" below.') + '</p></div>'
          : '<div style="margin:0 16px 24px; border-radius:12px; overflow:hidden; border:1px solid #2A3441;">' +
            displaySolutions.map(sol => {
              const imgSrc = (sol.images && sol.images.length > 0) ? sol.images[0] : null;
              return `
              <div class="ts-list-item" onclick="viewSolution(${sol.id})">
                ${imgSrc 
                  ? `<img src="${imgSrc}" class="ts-list-item__img" alt="photo">` 
                  : `<div class="ts-list-item__icon" style="width:60px;height:60px;border-radius:8px;">${iconFile}</div>`}
                
                <div class="ts-list-item__content">
                  <div class="ts-list-item__title">${MS.escapeHtml(sol.machine)} - ${MS.escapeHtml(sol.error)}</div>
                  <div class="ts-list-item__meta">
                    <span class="ts-meta-pill ts-meta-pill--brand">${iconSlots} ${MS.escapeHtml(sol.brand || 'Unknown')}</span>
                  </div>
                  <div class="ts-list-item__desc">${MS.escapeHtml(sol.solution)}</div>
                </div>
                
                <div class="ts-list-item__actions" onclick="event.stopPropagation();">
                  <button class="ts-action-btn" onclick="viewSolution(${sol.id})">View</button>
                  <button class="ts-action-btn" onclick="editSolution(${sol.id})">Edit</button>
                  <button class="ts-action-btn ts-action-btn--delete" onclick="deleteSolution(${sol.id})">Delete</button>
                </div>
              </div>
            `}).join('') +
            '</div>'
        ) +

        '<div class="ts-bottom-actions">' +
          '<button class="ts-action" id="openModalBtn">' +
            iconPlus +
            '<div class="ts-action__title">Add Solution</div>' +
            '<div class="ts-action__sub">Share your solution</div>' +
          '</button>' +
          '<a href="help.html" class="ts-action">' +
            iconBook +
            '<div class="ts-action__title">Help Guide</div>' +
            '<div class="ts-action__sub">How to use</div>' +
          '</a>' +
          '<a href="about.html" class="ts-action">' +
            iconInfoCircle +
            '<div class="ts-action__title">About</div>' +
            '<div class="ts-action__sub">More info</div>' +
          '</a>' +
        '</div>' +
      '</main>' +
      MS.bottomNav('troubleshoot');

    // Event Listeners
    document.getElementById('openModalBtn').addEventListener('click', () => openSolutionModal('add'));

    // Live Search Logic
    const searchInput = document.getElementById('tsSearchInput');
    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value;
      const val = e.target.value;
      renderUI();
      const newInput = document.getElementById('tsSearchInput');
      newInput.focus();
      newInput.setSelectionRange(val.length, val.length);
    });
  }

  // ===== Modal Functions =====
  function openSolutionModal(mode, data = null) {
    const titleEl = document.getElementById('modalTitleText');
    const idEl = document.getElementById('solId');
    
    if (mode === 'add') {
      titleEl.textContent = 'Add New Solution';
      idEl.value = '';
      document.getElementById('solMachine').value = '';
      document.getElementById('solError').value = '';
      document.getElementById('solSolution').value = '';
      currentImages = [];
      previewGrid.innerHTML = '';
    } else if (mode === 'edit' && data) {
      titleEl.textContent = 'Edit Solution';
      idEl.value = data.id;
      document.getElementById('solMachine').value = data.machine;
      document.getElementById('solError').value = data.error;
      document.getElementById('solSolution').value = data.solution;
      currentImages = data.images || [];
      renderPreviewGrid();
    }
    solutionModal.classList.add('show');
  }

  function renderPreviewGrid() {
    previewGrid.innerHTML = '';
    currentImages.forEach((imgSrc, index) => {
      const wrap = document.createElement('div');
      wrap.className = 'ms-preview-img-wrap';
      wrap.innerHTML = `
        <img src="${imgSrc}" class="ms-preview-img">
        <button class="ms-preview-img-remove" onclick="removePreviewImage(${index})">✕</button>
      `;
      previewGrid.appendChild(wrap);
    });
  }

  window.removePreviewImage = function(index) {
    currentImages.splice(index, 1);
    renderPreviewGrid();
  };

  document.getElementById('closeModalBtn').addEventListener('click', () => solutionModal.classList.remove('show'));
  document.getElementById('cancelModalBtn').addEventListener('click', () => solutionModal.classList.remove('show'));

  document.getElementById('uploadArea').addEventListener('click', () => fileInput.click());

  fileInput.addEventListener('change', async (e) => {
    const files = Array.from(e.target.files);
    for (const file of files) {
      try {
        const base64 = await compressImage(file, 800, 0.6);
        currentImages.push(base64);
      } catch (err) { console.error(err); }
    }
    renderPreviewGrid();
    fileInput.value = '';
  });

  document.getElementById('saveSolutionBtn').addEventListener('click', () => {
    const id = document.getElementById('solId').value;
    const machine = document.getElementById('solMachine').value.trim();
    const error = document.getElementById('solError').value.trim();
    const solution = document.getElementById('solSolution').value.trim();

    if (!machine || !error || !solution) {
      showAlert('Missing Info', 'Please enter Machine Name, Error Name, and Solution');
      return;
    }

    const currentSols = getSolutions();
    if (id) {
      const index = currentSols.findIndex(s => s.id == id);
      if (index > -1) {
        currentSols[index].machine = machine;
        currentSols[index].error = error;
        currentSols[index].solution = solution;
        currentSols[index].images = currentImages;
      }
    } else {
      currentSols.unshift({
        id: Date.now(), machine, error, solution, brand: 'Unknown', images: currentImages
      });
    }

    if (saveSolutions(currentSols)) {
      solutionModal.classList.remove('show');
      renderUI();
    }
  });

  // ===== View / Edit / Delete / Image Lightbox =====
  window.viewSolution = function(id) {
    const sols = getSolutions();
    const sol = sols.find(s => s.id === id);
    if (!sol) return;

    let imagesHtml = '';
    if (sol.images && sol.images.length > 0) {
      imagesHtml = '<div class="ms-view-images">' + 
        sol.images.map(img => `<img src="${img}" onclick="openLightbox('${img}')">`).join('') + 
      '</div>';
    }

    document.getElementById('viewContent').innerHTML = `
      <div style="font-size: 18px; font-weight: 900; color: #fff; margin-bottom: 4px;">${MS.escapeHtml(sol.machine)}</div>
      <div style="font-size: 14px; color: #EF4444; font-weight: 700; margin-bottom: 16px;">${MS.escapeHtml(sol.error)}</div>
      ${imagesHtml}
      <div class="ms-view-solution">${MS.escapeHtml(sol.solution)}</div>
    `;
    viewModal.classList.add('show');
  };

  window.openLightbox = function(imgSrc) {
    viewerImg.src = imgSrc;
    imageViewer.classList.add('show');
  };

  document.getElementById('closeImageViewer').onclick = () => imageViewer.classList.remove('show');
  imageViewer.onclick = (e) => { if(e.target === imageViewer) imageViewer.classList.remove('show'); };

  document.getElementById('closeViewBtn').onclick = () => viewModal.classList.remove('show');
  document.getElementById('closeViewActionBtn').onclick = () => viewModal.classList.remove('show');

  window.editSolution = function(id) {
    const sols = getSolutions();
    const sol = sols.find(s => s.id === id);
    if (sol) openSolutionModal('edit', sol);
  };

  window.deleteSolution = function(id) {
    showAlert('Delete Solution', 'Are you sure you want to delete this solution? This cannot be undone.', true, () => {
      let sols = getSolutions();
      sols = sols.filter(s => s.id !== id);
      saveSolutions(sols);
      renderUI();
    });
  };

  // ===== Image Compression =====
  function compressImage(file, maxWidth, quality) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = (event) => {
        const img = new Image();
        img.src = event.target.result;
        img.onload = () => {
          const canvas = document.createElement('canvas');
          let width = img.width;
          let height = img.height;
          if (width > maxWidth) {
            height = Math.round((height * maxWidth) / width);
            width = maxWidth;
          }
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.onerror = (error) => reject(error);
      };
      reader.onerror = (error) => reject(error);
    });
  }

  renderUI();
})();
</script>
</body>

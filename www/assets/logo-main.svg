<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="#14213D"/>
  <!-- Arcade cabinet body -->
  <rect x="14" y="12" width="30" height="40" rx="4" fill="#1B2D4A" stroke="#3978F6" stroke-width="1.5"/>
  <!-- Screen -->
  <rect x="18" y="16" width="22" height="16" rx="2" fill="#F5AE32" opacity=".9"/>
  <!-- Screen code lines -->
  <rect x="20" y="19" width="10" height="1.5" rx=".75" fill="#14213D" opacity=".5"/>
  <rect x="20" y="22.5" width="14" height="1.5" rx=".75" fill="#14213D" opacity=".5"/>
  <rect x="20" y="26" width="8" height="1.5" rx=".75" fill="#14213D" opacity=".5"/>
  <!-- Buttons row -->
  <circle cx="21" cy="38" r="2" fill="#F5AE32"/>
  <circle cx="27" cy="38" r="2" fill="#E05252"/>
  <circle cx="33" cy="38" r="2" fill="#20A66A"/>
  <!-- Joystick base -->
  <rect x="18" y="44" width="10" height="2" rx="1" fill="#3978F6"/>
  <!-- Magnifying glass (lens overlapping bottom-right) -->
  <circle cx="44" cy="44" r="10" fill="none" stroke="#F5AE32" stroke-width="3"/>
  <circle cx="44" cy="44" r="10" fill="#F5AE32" opacity=".12"/>
  <!-- Glass shine -->
  <path d="M39 40 Q41 38 44 38" stroke="#fff" stroke-width="1.5" stroke-linecap="round" opacity=".5"/>
  <!-- Handle -->
  <line x1="51" y1="51" x2="57" y2="57" stroke="#F5AE32" stroke-width="3" stroke-linecap="round"/>
</svg>

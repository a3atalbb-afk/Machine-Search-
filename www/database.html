<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0E14">
<title>Database — MACHINE SEARCH</title>
<link rel="stylesheet" href="brand.css">
<link rel="stylesheet" href="components.css">
<link rel="stylesheet" href="bg.css">
<link rel="stylesheet" href="styles.css">

<style id="ms-black-bg-theme">
  html, body {
    background-color: #0B0E14;
    color: #CBD5E1;
    -webkit-font-smoothing: antialiased;
  }

  .topbar, .app-header, .ms-header, .back-header, .ms-back-header, header,
  .bottom-nav, .ms-bottom-nav, nav.bottom-nav {
    background-color: #10141C;
    color: #CBD5E1;
    border-color: #252C3A;
  }

  .card, .panel, .box, .ms-card, .state, [class*="card"] {
    background: #12161F;
    color: #CBD5E1;
    border-color: #252C3A;
    box-shadow: none;
  }

  input, select, textarea {
    background-color: #090C11;
    color: #CBD5E1;
    border-color: #2D3648;
  }

  button, .btn {
    background: #1B2230;
    color: #E2E8F0;
    border-color: #2D3648;
    box-shadow: none;
  }
</style>
</head>
<body>
<div id="app"></div>
<script src="app.js?v=1005"></script>
<script>
(async function () {
  const app = document.getElementById('app');
  const data = await MS.loadData();
  const machines = data.machines || [];
  const hasDb = data.meta && data.meta.filename !== '—';

  app.innerHTML = MS.backHeader('Database') + `
    <main class="container" style="padding-top: 16px;">
      <div class="card card--pad" style="margin-bottom: 16px;">
        <div class="row" style="justify-content: space-between;">
          <div>
            <div style="font-size: 11px; font-weight: 800; color: var(--text-muted); text-transform: uppercase;">Active Database</div>
            <div style="font-weight: 800; font-size: 16px; margin-top: 2px;">${hasDb ? MS.escapeHtml(data.meta.filename) : 'Empty'}</div>
            <div style="font-size: 12px; color: var(--text-secondary);">${machines.length} records</div>
          </div>
          <a href="import.html" class="btn btn--primary" style="height: 36px; text-decoration: none; font-size: 12px;">REPLACE</a>
        </div>
      </div>
      <div id="list"></div>
    </main>
  ` + MS.bottomNav('database');

  const listEl = document.getElementById('list');
  
  if(machines.length === 0) {
    listEl.innerHTML = `<div class="state"><div class="state__icon">${MS.ICON.database}</div><div class="state__title">No database loaded</div></div>`;
    return;
  }

  listEl.innerHTML = machines.map(m => `
    <a class="db-list-item" href="details.html?code=${encodeURIComponent(m.code)}">
      <div class="icon-box">${MS.ICON.machine}</div>
      <div class="flex-1">
        <div class="db-list-item__name">${MS.escapeHtml(m.name)}</div>
        <div class="db-list-item__code">${MS.escapeHtml(m.code)}</div>
      </div>
    </a>
  `).join('');
})();
</script>
</body>
</html>

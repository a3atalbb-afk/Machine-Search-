<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0E14">
<title>အကြောင်းအရာ — MACHINE SEARCH</title>
<link rel="stylesheet" href="brand.css">
<link rel="stylesheet" href="components.css">
<link rel="stylesheet" href="bg.css">
<link rel="stylesheet" href="styles.css">
<style>
  .about-hero {
    background: linear-gradient(135deg, var(--surface, #151C2C), var(--card, #151C2C));
    border: 1px solid var(--border, #2A364F);
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .about-hero h1 {
    margin: 0;
    font-size: clamp(20px, 4.8vw, 26px);
    font-weight: 900;
    line-height: 1.25;
    color: #fff;
  }
  .about-hero h1 .accent {
    color: var(--color-primary, #D32F2F);
  }
  .about-hero__sub {
    margin-top: 6px;
    font-size: 13px;
    color: var(--text-secondary, #A0ABC0);
  }
  .about-pills {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 12px;
  }
  .about-pill {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 11.5px;
    font-weight: 800;
    background: rgba(13, 16, 23, 0.5);
    border: 1px solid var(--border, #2A364F);
    color: var(--text, #F4F5F7);
  }
  .about-pill--ok {
    color: #22C55E;
    border-color: rgba(34,197,94,0.3);
    background: rgba(34,197,94,0.1);
  }

  .about-card {
    background: var(--card, #151C2C);
    border: 1px solid var(--border, #2A364F);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 12px;
  }
  .about-card h3 {
    font-size: 15px;
    font-weight: 900;
    color: #fff;
    margin: 0 0 12px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border, #2A364F);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .about-card h3 .bullet {
    width: 4px;
    height: 14px;
    background: var(--color-primary, #D32F2F);
    border-radius: 2px;
  }
  .about-card p {
    margin: 0 0 10px;
    font-size: 13.5px;
    line-height: 1.7;
    color: var(--text-secondary, #A0ABC0);
  }
  .about-card p:last-child {
    margin-bottom: 0;
  }
  .about-card p b {
    color: #fff;
  }

  .about-dev {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px;
    border-radius: 10px;
    background: var(--surface, #151C2C);
    border: 1px solid var(--border, #2A364F);
  }
  .about-dev__avatar {
    width: 52px;
    height: 52px;
    border-radius: 12px;
    background: var(--color-primary, #D32F2F);
    color: #fff;
    font-size: 18px;
    font-weight: 900;
    display: grid;
    place-items: center;
    flex-shrink: 0;
  }
  .about-dev__name {
    font-size: 16px;
    font-weight: 900;
    color: #fff;
  }
  .about-dev__role {
    font-size: 12.5px;
    color: var(--text-secondary, #A0ABC0);
    margin-top: 2px;
  }

  .about-info-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 10px 12px;
    border-radius: 8px;
    background: var(--surface, #151C2C);
    border: 1px solid var(--border, #2A364F);
    font-size: 12.5px;
    margin-bottom: 6px;
  }
  .about-info-row:last-child { margin-bottom: 0; }
  .about-info-row__key {
    color: var(--text-muted, #64748B);
    font-weight: 700;
  }
  .about-info-row__val {
    color: #fff;
    font-weight: 800;
    text-align: right;
  }

  .about-copyright {
    text-align: center;
    padding: 12px;
    border-radius: 10px;
    background: var(--surface, #151C2C);
    border: 1px solid var(--border, #2A364F);
    font-size: 12px;
    line-height: 1.6;
    color: var(--text-muted, #64748B);
    margin-top: 12px;
  }
</style>
</head>
<body>
<div id="app"></div>
<script src="app.js?v=1006"></script>
<script>
(function () {
  const app = document.getElementById('app');
  app.innerHTML =
    MS.backHeader('အကြောင်းအရာ') +
    '<main class="container" style="padding-top:16px; padding-bottom:32px;">' +

        '<div class="about-pills">' +
          '<span class="about-pill">ဗားရှင်း 1.0.0</span>' +
          '<span class="about-pill about-pill--ok">✓ 100% Offline</span>' +
          '<span class="about-pill">Developer: Super ko Tint</span>' +
        '</div>' +
      '</section>' +

      '<div class="about-card">' +
        '<h3><span class="bullet"></span>စနစ်ခြုံငုံသုံးသပ်ချက်</h3>' +

      '</div>' +

      '<div class="about-card">' +
        '<h3><span class="bullet"></span>Developer</h3>' +
        '<div class="about-dev">' +
          '<div class="about-dev__avatar">SK</div>' +
          '<div>' +
            '<div class="about-dev__name">Super ko Tint</div>' +
            '<div class="about-dev__role">Developer · MACHINE SEARCH</div>' +
          '</div>' +
        '</div>' +
      '</div>' +

      '<div class="about-card">' +
        '<h3><span class="bullet"></span>Application Info</h3>' +
        '<div class="about-info-row"><span class="about-info-row__key">Version</span><span class="about-info-row__val">1.0.0</span></div>' +

      '</div>' +

      '<div class="about-copyright">' +

</body>
</html>

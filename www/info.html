<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0E14">
<title>Database Info — MACHINE SEARCH</title>
<link rel="stylesheet" href="brand.css">
<link rel="stylesheet" href="components.css">
<link rel="stylesheet" href="bg.css">
<link rel="stylesheet" href="styles.css">
<style>
  .btn--danger {
    background: var(--color-primary, #D32F2F);
    color: #fff;
    border: none;
    border-radius: 8px;
    height: 48px;
    font-weight: 800;
    font-size: 14px;
    cursor: pointer;
    width: 100%;
  }
  .btn--danger:hover {
    opacity: 0.9;
  }
  .btn--danger:active {
    transform: scale(0.98);
  }
  .btn--block {
    display: block;
    width: 100%;
  }
</style>
</head>
<body>
<div id="app"></div>
<script src="app.js?v=1006"></script>
<script>
(async function () {
  const app = document.getElementById('app');

  let data;
  try {
    data = await MS.loadData();
  } catch (e) {
    app.innerHTML = MS.backHeader('Database Information') +
      '<main class="container" style="padding-top: 16px;">' +
        '<div class="state">' +
          '<div class="state__icon">' + MS.ICON.warning + '</div>' +
          '<div class="state__title">Database load failed</div>' +
        '</div>' +
      '</main>' +
      MS.bottomNav('settings');
    return;
  }

  const machines = data.machines || [];
  const meta = data.meta || {};
  const filename = meta.filename || '—';
  const sheet = meta.sheet || '—';
  const location = meta.location || '—';
  const importedAt = (meta.importedAt && meta.importedAt !== '—')
    ? new Date(meta.importedAt).toLocaleString()
    : '—';

  app.innerHTML = MS.backHeader('Database Information') +
    '<main class="container" style="padding-top: 16px;">' +
      '<div class="card card--pad">' +
        '<div class="info-list">' +
          '<div class="info-row"><span class="info-row__key">Active File</span><span class="info-row__value">' + MS.escapeHtml(filename) + '</span></div>' +
          '<div class="info-row"><span class="info-row__key">Sheet Name</span><span class="info-row__value">' + MS.escapeHtml(sheet) + '</span></div>' +
          '<div class="info-row"><span class="info-row__key">Total Records</span><span class="info-row__value">' + machines.length + '</span></div>' +
          '<div class="info-row"><span class="info-row__key">Location</span><span class="info-row__value">' + MS.escapeHtml(location) + '</span></div>' +
          '<div class="info-row"><span class="info-row__key">Last Import</span><span class="info-row__value">' + MS.escapeHtml(importedAt) + '</span></div>' +
        '</div>' +
      '</div>' +
      '<button class="btn--danger btn--block" style="margin-top:24px" id="clearDbBtn">' +
        'CLEAR DATABASE' +
      '</button>' +
    '</main>' +
    MS.bottomNav('settings');

  document.getElementById('clearDbBtn').addEventListener('click', () => {
    if (!confirm('Delete all imported data? A backup will be created first.')) return;

    // Backup before clearing
    try {
      const current = localStorage.getItem('ms_data_v2');
      if (current) {
        localStorage.setItem('ms_data_v2_backup_' + Date.now(), current);
      }
    } catch (e) { console.warn('backup failed', e); }

    MS.clearData();
    MS.toast('Database cleared (backup saved)', 'ok');
    setTimeout(() => location.reload(), 800);
  });
})();
</script>
</body>
</html>
